tter":"C","text":"An agent loop that resends the same 12,000-token system prompt and tool definitions on every turn"},{"letter":"D","text":"An endpoint where many users ask questions about the same 50-page policy within minutes of each other"},{"letter":"E","text":"A weekly job that sends one unique 3,000-token prompt, different every time it runs"}],"answer":["C","D"],"explanation":"Caching pays off when a long, stable prefix repeats within the cache lifetime (C, D). A weekly unique prompt (E) never repeats in time. A timestamp at the start (B) breaks the prefix on every request. Prompts under the minimum length (A) are never cached."},{"n":7,"domain":"d2","scenario":null,"stem":"An eligibility step must apply six interacting rules. Accuracy is the priority, and the latency budget is generous. Which prompting approach fits?","code":null,"options":[{"letter":"A","text":"A lower effort level, so that the model commits to an answer before it overthinks the interacting rules"},{"letter":"B","text":"Few-shot examples alone, with no stated rules, so the model infers the logic from the cases"},{"letter":"C","text":"Have the model reason through each rule, stated as an explicit criterion, before deciding, then validate the result"},{"letter":"D","text":"A zero-shot prompt kept as short as possible, so that the model isn't distracted by the detail of the six rules"}],"answer":["C"],"explanation":"Multi-step logic benefits from explicit reasoning before the answer, and the generous latency budget covers its cost (C). Zero-shot (D) suits simple, unambiguous tasks. Examples (B) teach format and edge cases, and six interacting rules still need to be stated. Lower effort (A) cuts the reasoning the task needs."},{"n":8,"domain":"d2","scenario":null,"stem":"An enterprise assistant's system prompt has grown to 60,000 tokens of procedures for 40 business processes, and most requests need one or two of them. Latency and cost are high, and instruction-following has slipped. What is the best restructuring?","code":null,"options":[{"letter":"A","text":"Build 40 separate assistants, one per business process, and make users choose the right one"},{"letter":"B","text":"Move to a model with a larger context window, so that all 40 procedures fit with plenty of room to spare"},{"letter":"C","text":"Mark the most important procedures in capitals so the model gives them priority over the rest"},{"letter":"D","text":"Keep the system prompt to the core role and rules, and load each procedure as a Skill only when relevant"}],"answer":["D"],"explanation":"Loading procedures on demand keeps the context small and focused, which improves attention, cost and latency together (D). Emphasis (C) doesn't shrink the prompt. A bigger window (B) holds more of the same dilution. A moves the routing problem onto users."},{"n":9,"domain":"d2","scenario":null,"stem":"Downstream systems consume the assistant's JSON, and occasional schema violations cause failed transactions. Which change addresses this at the source, and what still needs checking?","code":null,"options":[{"letter":"A","text":"Structured outputs with the integration schema, plus semantic checks and handling of refusal and length stops"},{"letter":"B","text":"A stronger instruction to follow the schema exactly, repeated at the end of the system prompt"},{"letter":"C","text":"A retry loop that resends any request whose JSON fails validation, until a valid response arrives"},{"letter":"D","text":"A regex step that repairs broken JSON before it is passed on to the downstream systems"}],"answer":["A"],"explanation":"Constrained decoding removes schema violations at the source, and semantic checks plus stop-reason handling cover what it doesn't guarantee (A). Retries (C) and instructions (B) reduce failures without eliminating them. Regex repair (D) guesses at intent and can corrupt data quietly."},{"n":10,"domain":"d3","scenario":null,"stem":"A procurement agent must get quotes from a supplier's own AI agent, which runs on the supplier's systems with its own tools, policies and reasoning. Which integration mechanism fits?","code":null,"options":[{"letter":"A","text":"Agent-to-agent delegation over a defined protocol, with request and response contracts and auth"},{"letter":"B","text":"A direct API call to Claude with the supplier's price list pasted into the prompt for each quote"},{"letter":"C","text":"An MCP server that gives your agent direct access to the supplier's database of current prices"},{"letter":"D","text":"A shared system prompt that both companies edit, so the two agents follow the same instructions"}],"answer":["A"],"explanation":"Two autonomous systems with separate owners, tools and policies call for delegation between agents, with contracts and isolation so either side can fail independently (A). C bypasses the supplier's agent and policies and assumes access you won't get. B works only if you already have current prices, which is what you're asking for. D merges two organizations' control into one prompt."},{"n":11,"domain":"d3","scenario":null,"stem":"One internal app sends support tickets to Claude for tagging. One team owns it, and no reuse is planned. A platform engineer proposes building an MCP server first. What is the right assessment?","code":null,"options":[{"letter":"A","text":"Fine-tune a tagging model instead, so the app no longer needs to call Claude at all"},{"letter":"B","text":"Build the MCP server now, since every integration should go through MCP as a matter of standard"},{"letter":"C","text":"Use a direct API integration now, and revisit MCP if other surfaces later need the capability"},{"letter":"D","text":"Use agent-to-agent delegation between the ticketing app and a dedicated tagging agent"}],"answer":["C"],"explanation":"MCP pays off when one capability serves many clients or surfaces, and one app with one owner is the direct-API case (C). B adds maintenance for a benefit that doesn't exist yet. D adds autonomous-system machinery to a single call. A skips a simpler option that works."},{"n":12,"domain":"d3","scenario":null,"stem":"Which TWO observations are signs of capability bloat in a production agent? (Select TWO)","code":null,"options":[{"letter":"A","text":"Two tools have overlapping descriptions, and both plausibly handle 'find a customer'"},{"letter":"B","text":"Each subagent's tools are scoped to the single responsibility it has in the system"},{"letter":"C","text":"The reporting agent uses read-only credentials for the databases it queries"},{"letter":"D","text":"It exposes 45 tools, and invocation logs show only 9 ever used"},{"letter":"E","text":"Tool descriptions state when not to use each tool"}],"answer":["A","D"],"explanation":"Unused tools that ship with every request (D) and overlapping tools that blur selection (A) are classic signs of bloat. Scoped toolsets (B), read-only credentials for a read-only job (C) and boundary statements in descriptions (E) are the cure."},{"n":13,"domain":"d3","scenario":null,"stem":"An agent connects to six MCP servers exposing 300 tools, and every request front-loads all of their definitions. Tool selection is poor and costs are high. What is the best fix?","code":null,"options":[{"letter":"A","text":"Add more examples to the system prompt showing which tool to pick for each of the common kinds of request"},{"letter":"B","text":"Shorten every tool description to a single line, so the definitions take up fewer tokens"},{"letter":"C","text":"Move to a model with a larger context window, so that all 300 definitions fit comfortably"},{"letter":"D","text":"Load tool definitions on demand, such as with tool search, and give each agent only the servers it needs"}],"answer":["D"],"explanation":"Loading tools as the agent narrows in cuts tokens and improves selection accuracy, and scoping servers per responsibility removes tools that never belonged (D). A bigger window (C) holds the same noise. One-line descriptions (B) make selection worse. Examples (A) add tokens without reducing the tool count."},{"n":14,"domain":"d3","scenario":null,"stem":"A company assistant answers questions over the document store using a service account that can read every folder, including HR and legal. A contractor asked about salaries and got an answer. What is the root fix?","code":null,"options":[{"letter":"A","text":"Remove the HR documents from the index, so that the assistant can no longer retrieve them"},{"letter":"B","text":"Run retrieval and tools with the calling user's identity and permissions, and log each access"},{"letter":"C","text":"Add a system-prompt rule, 'Never discuss salaries', and repeat it at the start of each turn"},{"letter":"D","text":"Filter out any response that contains the word 'salary' before it reaches the contractor's screen"}],"answer":["B"],"explanation":"The shared over-privileged account erased per-user authorization and made every access unattributable, so the fix is acting as the caller (B). C is a probabilistic patch, A breaks legitimate HR use, and D is easy to get around and blocks legitimate answers."},{"n":15,"domain":"d3","scenario":null,"stem":"Engineers search an internal knowledge base with exact error codes such as 'E-4031.' Semantic search returns conceptually similar documents about other errors. What is the best fix?","code":null,"options":[{"letter":"A","text":"A larger embedding model, which captures the meaning of each individual error code more precisely"},{"letter":"B","text":"Hybrid search: keyword matching for exact identifiers plus semantic search, then re-ranking"},{"letter":"C","text":"Retrieve more chunks per query, so that the right document is more likely to be included"},{"letter":"D","text":"Fine-tune the generation model on the error codes, so that it recognizes each one on sight"}],"answer":["B"],"explanation":"Exact identifiers such as error codes and SKUs need keyword matching, which hybrid search adds alongside semantic retrieval (B). Better embeddings (A) still treat codes as fuzzy meaning. More chunks (C) add noise. The generation model (D) can't fix documents that were never retrieved."},{"n":16,"domain":"d4","scenario":null,"stem":"A contract-extraction service has three complaints: wrong values, slow responses at peak hours, and a rising monthly bill. Which THREE metrics should the monitoring plan track? (Select THREE)","code":null,"options":[{"letter":"A","text":"Field-level accuracy against a labeled dataset"},{"letter":"B","text":"Average response length"},{"letter":"C","text":"p95 and p99 latency"},{"letter":"D","text":"Number of prompt revisions per month"},{"letter":"E","text":"Cost per document and tokens per task"}],"answer":["A","C","E"],"explanation":"Each complaint maps to a metric: wrong values to accuracy (A), slowness to tail latency (C), and the bill to cost per unit of work (E). Prompt revision counts (D) and response length (B) measure activity, and neither shows whether the complaints are fixed."},{"n":17,"domain":"d4","scenario":null,"stem":"A team tuned its prompt against the same 200 examples it uses to report accuracy. Testing shows 98%, and production shows 84%. What went wrong, and what is the fix?","code":null,"options":[{"letter":"A","text":"The eval set leaked into tuning; tune on a development set and report on a held-out set like production"},{"letter":"B","text":"The model is too small for the variety in production, so the system should move up a tier"},{"letter":"C","text":"Production traffic is lower quality than the test examples, so it should be filtered before the model sees it"},{"letter":"D","text":"200 examples is too few to be reliable, so the team should add 20 more of the same kind"}],"answer":["A"],"explanation":"Tuning against the test set overfits to it, so the score stops predicting production (A). C blames the data the system has to handle. B changes the model without fixing the measurement. D keeps the same leak with a slightly bigger set."},{"n":18,"domain":"d4","scenario":null,"stem":"A team wants to ship a new prompt, new retrieval settings and a tier change together, because 'it felt better in 15 spot checks.' What is the correct approach?","code":null,"options":[{"letter":"A","text":"Run 15 more spot checks with a different reviewer to confirm the first impression"},{"letter":"B","text":"Ask the stakeholders which version they prefer after a short demo of both versions"},{"letter":"C","text":"Test one variable at a time, with a metric and sample size set in advance, and ship on a significant result"},{"letter":"D","text":"Ship all three changes together, since the spot checks were positive and it saves a release"}],"answer":["C"],"explanation":"A clean experiment changes one variable and decides on a metric chosen in advance (C). With three changes at once (D), a win or a loss can't be attributed to anything. Preference (B) and more spot checks (A) are still the feels-better method."},{"n":19,"domain":"d4","scenario":null,"stem":"Traces show the correct policy passages are retrieved, yet answers still state the wrong refund window. Where is the failure, and what is the first fix?","code":null,"options":[{"letter":"A","text":"Too few passages: raise the number retrieved per question so the model has more to go on"},{"letter":"B","text":"The index is stale, so it should be rebuilt from the latest version of every policy document"},{"letter":"C","text":"Retrieval: re-chunk and re-embed the whole corpus, so the passages match questions more closely"},{"letter":"D","text":"Generation: answer only from the retrieved passages, cite them, and evaluate faithfulness"}],"answer":["D"],"explanation":"When the right documents arrive and the answer is still wrong, the failure sits in generation and grounding (D). C and B fix retrieval, which the traces show is working. A adds noise to a context that already contains the answer."},{"n":20,"domain":"d4","scenario":null,"stem":"Answers about leave policies leave out exceptions. Traces show the retrieved chunks contain the rule sentence, while the exception sits in the next paragraph, which isn't retrieved. What is the best fix?","code":null,"options":[{"letter":"A","text":"Retrieve 30 chunks instead of 5, so the paragraph with the exception is more likely to be included"},{"letter":"B","text":"Move to a more capable model, which is better at inferring exceptions from the rule sentence"},{"letter":"C","text":"Tell the model in the system prompt to remember that most policies have exceptions"},{"letter":"D","text":"Re-chunk along the document's structure, with some overlap, so rules and exceptions stay together"}],"answer":["D"],"explanation":"Chunks smaller than the unit of meaning split rules from their qualifiers, so structure-aware chunking fixes the retrieval unit (D). More chunks (A) might catch the exception along with plenty of noise. No model (B) can use a paragraph it never receives, and an instruction (C) can't supply the missing text."},{"n":21,"domain":"d5","scenario":null,"stem":"An agent reads inbound customer emails and can issue refunds. Which TWO controls are deterministic, as opposed to prompt-based? (Select TWO)","code":null,"options":[{"letter":"A","text":"An output filter that blocks any reply containing a full account number"},{"letter":"B","text":"Few-shot examples of the agent declining suspicious requests"},{"letter":"C","text":"A system-prompt rule, 'Never issue large refunds', placed at the top of the agent's instructions"},{"letter":"D","text":"A persona instruction, 'You are a careful agent', repeated before each tool call"},{"letter":"E","text":"Tool permissions that cap a refund at $100 per call and send larger amounts for human approval"}],"answer":["A","E"],"explanation":"Permission limits (E) and output filtering (A) are enforced in code, whatever the model decides. C, D and B shape behavior probabilistically, and a cleverly written email can talk the model past them."},{"n":22,"domain":"d5","scenario":null,"stem":"A moderation pipeline handles 500,000 low-risk comments a day and occasionally receives legal threats. Which human-in-the-loop design fits?","code":null,"options":[{"letter":"A","text":"Have a human review every comment before it is published, so nothing slips through"},{"letter":"B","text":"Automate routine decisions with sampled QA; send legal threats and low-score cases to reviewers"},{"letter":"C","text":"Remove humans from the pipeline entirely, since the comments are low risk on the whole"},{"letter":"D","text":"Let the model escalate to a human whenever its self-reported confidence is low"}],"answer":["B"],"explanation":"Humans go where the risk is high, and sampling covers the routine volume (B). Reviewing everything (A) destroys the efficiency case. C leaves legal threats unhandled. Self-reported confidence (D) is poorly calibrated, so the thresholds that route cases to people have to be set by the system."},{"n":23,"domain":"d5","scenario":null,"stem":"A US telehealth company with patients in the US and Germany plans to use Claude to summarize clinical notes. Which TWO frameworks apply? (Select TWO)","code":null,"options":[{"letter":"A","text":"FedRAMP"},{"letter":"B","text":"HIPAA, for US patients' health information"},{"letter":"C","text":"GDPR, for the personal data of patients in the EU"},{"letter":"D","text":"None, since Claude is a third-party service"},{"letter":"E","text":"Only HIPAA, since the company is based in the US"}],"answer":["B","C"],"explanation":"The framework follows the data type and the jurisdiction: US health data brings HIPAA (B), and processing EU residents' personal data brings GDPR wherever the company is based (C). FedRAMP (A) covers cloud services for US federal agencies. E ignores the German patients, and D confuses using a vendor with being exempt."},{"n":24,"domain":"d5","scenario":null,"stem":"Your observability stack stores full prompts and responses, including customer personal data, in a log platform that 300 engineers can read. What is the risk, and what is the fix?","code":null,"options":[{"letter":"A","text":"Data leakage through logs: redact personal data first, restrict access, and set a retention limit"},{"letter":"B","text":"Ask the model in the system prompt to leave personal data out of every one of its responses"},{"letter":"C","text":"Encrypt the stored logs at rest and leave the access as it is for the 300 engineers"},{"letter":"D","text":"No real risk, because the logs are internal and every one of the 300 engineers works for the company"}],"answer":["A"],"explanation":"Logs and traces are a leakage channel, so the fix minimizes what's stored and who can see it (A). Internal access (D) still exposes customer data to hundreds of people. Encryption with unchanged access (C) protects the storage while every reader still sees the data. B leaves the personal data in the prompts, and the model can't be relied on to keep it out of responses."},{"n":25,"domain":"d5","scenario":null,"stem":"A resume-screening assistant ranks candidates for interviews. An audit finds that applicants from two universities abroad are ranked lower than equally qualified applicants. The candidate pool is balanced, and the system prompt tells the model to favor 'polished communication and familiarity with US business norms.' What is the source of the bias, and the right mitigation?","code":null,"options":[{"letter":"A","text":"Evaluation design: change the audit's test set until the gap between the groups disappears"},{"letter":"B","text":"Data bias: collect more resumes from the two universities so the model sees more of their graduates"},{"letter":"C","text":"Prompt framing: use job-related criteria applied identically to everyone, then re-measure by group"},{"letter":"D","text":"Model choice: move to a more capable tier, which judges candidates from abroad more fairly"}],"answer":["C"],"explanation":"The pool is balanced and the prompt itself encodes criteria that disadvantage the group, so the bias comes from prompt framing and the fix is neutral, job-related criteria, checked per group (C). More data (B) treats a data problem the audit didn't find. Changing the test set (A) hides the gap without fixing it. A stronger model (D) follows the same loaded instructions."},{"n":26,"domain":"d6","scenario":null,"stem":"Stakeholders ask for a guarantee that the assistant 'never gives a wrong answer.' What is the appropriate response?","code":null,"options":[{"letter":"A","text":"Commit only to 99.9% uptime, which the platform can guarantee, and leave accuracy out of the SLA"},{"letter":"B","text":"Promise 100% accuracy to secure approval, then work toward it during the first months in production"},{"letter":"C","text":"Refuse to set any accuracy target, since no LLM system can promise a specific level of quality"},{"letter":"D","text":"Commit to measured targets: accuracy per slice, an error budget, escalation paths, and a remediation plan"}],"answer":["D"],"explanation":"Probabilistic systems get SLAs built on measured rates, such as at least 96% accuracy per slice on a held-out set, with error budgets, escalation paths and remediation, and stakeholders should hear that LLM outputs have a measurable error rate (D). B sets up a broken promise. C leaves stakeholders nothing to hold the system to. Uptime (A) says nothing about answer quality."},{"n":27,"domain":"d6","scenario":null,"stem":"Which TWO artifacts belong in the handoff to the team that will operate the system? (Select TWO)","code":null,"options":[{"letter":"A","text":"Eval baselines and an inventory of prompts and their versions"},{"letter":"B","text":"The architect's personal working notes from the design phase"},{"letter":"C","text":"A raw export of the project chat channel from start to finish"},{"letter":"D","text":"Runbooks covering escalation paths and known failure modes"},{"letter":"E","text":"The kickoff slide deck that set out the project's goals and scope"}],"answer":["A","D"],"explanation":"Operators need to know how to respond to problems (D) and what normal looks like, along with what is deployed (A). Personal notes (B), kickoff slides (E) and raw chat (C) aren't operational documentation."},{"n":28,"domain":"d7","scenario":null,"stem":"Claude Code runs in your CI pipeline, and the team agrees it must never run git push or curl anywhere the repository is used. Where should this restriction live?","code":null,"options":[{"letter":"A","text":"A wiki page listing the commands that Claude Code must never run in any pipeline"},{"letter":"B","text":"Each developer's `~/.claude/settings.json`, set up during onboarding for the team"},{"letter":"C","text":"Deny rules in the committed project settings, such as `Bash(git push *)` and `Bash(curl *)`"},{"letter":"D","text":"A `CLAUDE.md` instruction at the top of the repository saying never to run git push or call curl"}],"answer":["C"],"explanation":"Permission rules in version-controlled project settings apply everywhere the repository runs, CI included, and the client enforces them (C). User settings (B) don't reach CI or other developers. `CLAUDE.md` (D) is guidance the model weighs. A wiki (A) is invisible to the tooling."},{"n":29,"domain":"d7","scenario":null,"stem":"A platform team built a code-review subagent and a release-notes skill that every repository in the company should use, in the same version. What is the best way to distribute them?","code":null,"options":[{"letter":"A","text":"Post the prompt text in a chat channel for developers to copy into their own setups"},{"letter":"B","text":"Package them as a plugin, or deploy them through managed settings, so everyone gets one version"},{"letter":"C","text":"Paste both definitions into every repository's `CLAUDE.md`, so each project carries them"},{"letter":"D","text":"Ask each developer to copy the files into their own `~/.claude/` folder during onboarding"}],"answer":["B"],"explanation":"Plugins bundle skills and subagents for distribution, and managed settings can push them to the whole organization, which keeps one maintained version (B). Copy-and-paste distribution (A, D) drifts as soon as the originals change. `CLAUDE.md` (C) holds always-on instructions and can't define a subagent or an on-demand skill."},{"n":30,"domain":"d7","scenario":null,"stem":"A team adopting Claude Code configured its repository so that pull requests written by Claude merge automatically once CI passes. A production incident traces back to one of those merges, and nobody on the team can explain the change. Which control restores human ownership of the code?","code":null,"options":[{"letter":"A","text":"Require a named human reviewer to approve every pull request, AI-written ones included"},{"letter":"B","text":"Have a second Claude session review each pull request before it merges into the main branch"},{"letter":"C","text":"Raise the test coverage threshold for AI-written pull requests before they can merge"},{"letter":"D","text":"Label AI-written pull requests so that they are easy to find after any later incident"}],"answer":["A"],"explanation":"Ownership means a person approves and answers for each change before it merges (A). An AI reviewer (B) adds a check without adding accountability. More coverage (C) catches more defects but still leaves nobody owning the change. A label (D) helps after an incident and does nothing before one."}]}]</script>
<script>
(function () {
  "use strict";
  var REPO = "https://github.com/preporato/claude-certification-guide";
  var BANKS = JSON.parse(document.getElementById("banks").textContent);
  var BY_ID = {};
  BANKS.forEach(function (b) { BY_ID[b.id] = b; });
  var app = document.getElementById("app");
  var topLink = document.getElementById("top-link");
  var S = null;        // the running session
  var timerId = null;

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function rich(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function same(a, b) { return a.length === b.length && a.slice().sort().join() === b.slice().sort().join(); }
  function words(n) { return ["zero", "one", "two", "three", "four", "five"][n] || String(n); }
  function joinLetters(l) { return l.length === 2 ? l.join(" and ") : l.join(", "); }
  function roleLine(b) {
    var parts = b.name.replace("Claude Certified ", "").split(" - ");
    return parts.join(" · ");
  }
  function clock(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60);
    return (m < 10 ? "0" : "") + m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
  }
  function getBest(id) {
    try { return JSON.parse(localStorage.getItem("ccg:v1:best:" + id) || "null"); } catch (e) { return null; }
  }
  function saveBest(id, correct, total) {
    try {
      var best = getBest(id);
      if (!best || correct > best.correct) {
        localStorage.setItem("ccg:v1:best:" + id, JSON.stringify({ correct: correct, total: total, at: Date.now() }));
      }
    } catch (e) { /* storage unavailable */ }
  }
  function setTop(b) {
    if (b) {
      topLink.href = b.certPage;
      topLink.innerHTML = "Full " + esc(b.code) + '<span class="long"> practice</span> tests ↗';
    } else {
      topLink.href = REPO;
      topLink.textContent = "GitHub ↗";
    }
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function top() { window.scrollTo(0, 0); }

  // ---------- home ----------
  function viewHome() {
    stopTimer();
    S = null;
    setTop(null);
    document.title = "Claude certification practice test: CCAO-F, CCDV-F, CCDV-P, CCA-F, CCAR-P";
    app.innerHTML =
      '<h1>Practice for your Claude certification</h1>' +
      '<p class="lead">30 questions for each of Anthropic’s five certification exams, written in the exam’s style, with an explanation for every answer. ' +
      'Practice at your own pace, or take a timed run and get a score for every domain.</p>' +
      '<div class="grid">' + BANKS.map(card).join("") + '</div>' +
      '<p class="note">Your results link each weak domain to its notes in the <a href="' + REPO + '">study guides</a>. Best scores are saved in this browser only.</p>';
  }
  function card(b) {
    var best = getBest(b.id);
    return '<article class="card">' +
      '<div class="cover" aria-hidden="true"><b>' + esc(b.code) + '</b><span>' + esc(roleLine(b)) + '</span></div>' +
      '<div class="card-body">' +
        '<h2>' + esc(b.name) + '</h2>' +
        '<p class="meta">' + b.questions.length + ' questions · ' + b.domains.length + ' domains · timed run ' + b.minutes + ' minutes</p>' +
        (best ? '<p class="best">Your best: ' + best.correct + ' of ' + best.total + '</p>' : '') +
        '<div class="row">' +
          '<button class="btn btn-dark btn-grow" data-start="' + b.id + '" data-mode="timed">Timed test</button>' +
          '<button class="btn btn-ghost btn-grow" data-start="' + b.id + '" data-mode="practice">Practice</button>' +
        '</div>' +
      '</div></article>';
  }

  // ---------- exam intro (deep links such as #cca-f) ----------
  function viewIntro(b) {
    stopTimer();
    S = null;
    setTop(b);
    document.title = b.code + " practice test · Claude Certification Guide";
    var best = getBest(b.id);
    var multi = b.questions.filter(function (q) { return q.answer.length > 1; }).length;
    app.innerHTML = '<div class="narrow">' +
      '<div class="card" style="margin-top:16px"><div class="cover" aria-hidden="true"><b>' + esc(b.code) + '</b><span>' + esc(roleLine(b)) + '</span></div></div>' +
      '<h1>' + esc(b.code) + ' practice test</h1>' +
      '<p class="lead">' + b.questions.length + ' questions for ' + esc(b.name) + ', spread across the exam’s ' + b.domains.length + ' domains by their official weights. ' +
      multi + ' of them ask for more than one answer, as the exam does; those count only when every choice is right.</p>' +
      (best ? '<p class="best">Your best so far: ' + best.correct + ' of ' + best.total + '</p>' : '') +
      '<div class="row">' +
        '<button class="btn btn-dark btn-grow" data-start="' + b.id + '" data-mode="timed">Timed test (' + b.minutes + ' minutes)</button>' +
        '<button class="btn btn-ghost btn-grow" data-start="' + b.id + '" data-mode="practice">Practice with explanations</button>' +
      '</div>' +
      '<p class="note">The real exam has ' + b.exam.questions + ' questions' + (b.exam.scored && b.exam.scored < b.exam.questions ? ' (' + b.exam.scored + ' scored)' : '') + ' in ' + b.exam.minutes + ' minutes, and the timed run keeps the same pace. ' +
      '<a href="./">All ' + BANKS.length + ' exams</a></p>' +
    '</div>';
  }

  // ---------- quiz ----------
  function start(id, mode, subset) {
    var b = BY_ID[id];
    if (!b) return viewHome();
    stopTimer();
    var idx = subset || b.questions.map(function (_, i) { return i; });
    S = {
      b: b, mode: mode, idx: idx, i: 0, ans: {}, checked: {}, flag: {}, retry: !!subset,
      started: Date.now(), done: false,
      deadline: mode === "timed" ? Date.now() + Math.round(b.minutes * 60000 * idx.length / b.questions.length) : null
    };
    setTop(b);
    document.title = b.code + " " + (mode === "timed" ? "timed test" : "practice") + " · Claude Certification Guide";
    if (S.deadline) {
      timerId = setInterval(function () {
        var left = S.deadline - Date.now();
        var el = document.getElementById("timer");
        if (el) {
          el.textContent = clock(left);
          el.classList.toggle("low", left < 5 * 60000);
        }
        if (left <= 0) finish();
      }, 1000);
    }
    viewQuiz();
    top();
  }

  function current() { return S.b.questions[S.idx[S.i]]; }

  function viewQuiz() {
    var b = S.b, qi = S.idx[S.i], q = b.questions[qi], n = S.idx.length;
    var multi = q.answer.length > 1;
    var chosen = S.ans[qi] || [];
    var checked = S.mode === "practice" && S.checked[qi];
    var scenario = null;
    if (q.scenario) b.scenarios.forEach(function (s) { if (s.id === q.scenario) scenario = s; });
    var domain = null;
    b.domains.forEach(function (d) { if (d.id === q.domain) domain = d; });
    var answeredCount = Object.keys(S.ans).filter(function (k) { return S.ans[k].length; }).length;

    var html = '<div class="narrow">' +
      '<div class="qhead"><span>' + esc(b.code) + ' <span class="mode">· ' + (S.mode === "timed" ? "Timed test" : (S.retry ? "Retry" : "Practice")) + '</span></span>' +
      (S.deadline ? '<span class="timer" id="timer" role="timer" aria-label="Time left">' + clock(S.deadline - Date.now()) + '</span>'
                  : '<span>' + (S.i + 1) + ' / ' + n + '</span>') +
      '</div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * (S.mode === "timed" ? answeredCount : S.i + (checked ? 1 : 0)) / n) + '%"></i></div>';

    if (scenario) {
      html += '<details class="scenario" open><summary>Scenario: ' + esc(scenario.title) + '</summary><p>' + rich(scenario.text) + '</p></details>';
    }
    html += '<p class="qlabel"><b>Question ' + (S.i + 1) + ' of ' + n + '</b> · ' + esc(domain ? domain.name : "") + '</p>' +
      '<p class="stem" id="stem">' + rich(q.stem) + '</p>';
    if (q.code) html += '<pre><code>' + esc(q.code.text) + '</code></pre>';
    if (multi && !checked) html += '<p class="hint" id="hint">Choose ' + words(q.answer.length) + '.</p>';

    html += '<fieldset class="opts' + (multi ? ' multi' : '') + '" aria-labelledby="stem"><legend class="sr-only">Answer options</legend>';
    q.options.forEach(function (o) {
      var isChosen = chosen.indexOf(o.letter) >= 0;
      var cls = "opt";
      if (checked) {
        cls += " locked";
        if (q.answer.indexOf(o.letter) >= 0) cls += " right";
        else if (isChosen) cls += " wrong";
      } else if (isChosen) cls += " sel";
      html += '<label class="' + cls + '"><input type="' + (multi ? "checkbox" : "radio") + '" name="opt" value="' + o.letter + '"' +
        (isChosen ? " checked" : "") + (checked ? " disabled" : "") + '><span class="let" aria-hidden="true">' + o.letter + '</span>' +
        '<span class="txt"><span class="sr-only">' + o.letter + '. </span>' + rich(o.text) + '</span></label>';
    });
    html += '</fieldset>';

    if (checked) {
      var ok = same(chosen, q.answer);
      html += '<div class="feedback" role="status"><h3 class="' + (ok ? "ok" : "bad") + '">' +
        (ok ? "Correct" : "Not quite. The answer is " + joinLetters(q.answer) + ".") + '</h3>' +
        '<p>' + rich(q.explanation) + '</p></div>';
    }

    html += '<div class="actions">';
    if (S.mode === "practice") {
      if (!checked) {
        html += '<button class="btn btn-dark btn-grow" data-act="check"' + (chosen.length === q.answer.length ? "" : " disabled") + '>Check answer</button>';
      } else {
        html += '<button class="btn btn-dark btn-grow" data-act="next">' + (S.i + 1 < n ? "Next question" : "See results") + '</button>';
      }
      html += '<button class="btn btn-ghost" data-act="quit">End practice</button>';
    } else {
      html += '<button class="btn btn-ghost" data-act="prev"' + (S.i === 0 ? " disabled" : "") + '>Back</button>' +
        '<button class="btn btn-ghost" data-act="flag" aria-pressed="' + (S.flag[qi] ? "true" : "false") + '">' + (S.flag[qi] ? "Unflag" : "Flag for review") + '</button>' +
        (S.i + 1 < n ? '<button class="btn btn-dark btn-grow" data-act="next">Next</button>'
                     : '<button class="btn btn-dark btn-grow" data-act="finish">Finish test</button>');
    }
    html += '</div>';

    if (S.mode === "timed") {
      html += '<nav class="nav" aria-label="Questions"><p>' + answeredCount + ' of ' + n + ' answered' +
        (Object.keys(S.flag).filter(function (k) { return S.flag[k]; }).length ? ' · flagged questions have a dot' : '') + '</p><div class="dots">';
      S.idx.forEach(function (qIndex, pos) {
        var cls = "dot";
        if ((S.ans[qIndex] || []).length) cls += " done";
        if (pos === S.i) cls += " cur";
        if (S.flag[qIndex]) cls += " flagged";
        html += '<button class="' + cls + '" data-go="' + pos + '" aria-label="Question ' + (pos + 1) + '"' + (pos === S.i ? ' aria-current="step"' : '') + '>' + (pos + 1) + '</button>';
      });
      html += '</div>' + (S.i + 1 < n ? '<div class="actions"><button class="btn btn-ghost btn-grow" data-act="finish">Finish test</button></div>' : '') + '</nav>';
    }
    html += '</div>';
    app.innerHTML = html;
  }

  function choose(letter) {
    var qi = S.idx[S.i], q = current();
    if (S.mode === "practice" && S.checked[qi]) return;
    var chosen = (S.ans[qi] || []).slice();
    var multi = q.answer.length > 1;
    if (!multi) chosen = [letter];
    else {
      var at = chosen.indexOf(letter);
      if (at >= 0) chosen.splice(at, 1);
      else {
        chosen.push(letter);
        if (chosen.length > q.answer.length) chosen.shift(); // keep the most recent picks
      }
    }
    S.ans[qi] = chosen;
    var focusLetter = letter;
    viewQuiz();
    var input = app.querySelector('input[value="' + focusLetter + '"]');
    if (input) input.focus({ preventScroll: true });
  }

  function act(name) {
    var n = S.idx.length, qi = S.idx[S.i], q = current();
    if (name === "check") {
      if ((S.ans[qi] || []).length !== q.answer.length) return;
      S.checked[qi] = true;
      viewQuiz();
      var fb = app.querySelector(".feedback");
      if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else if (name === "next") {
      if (S.i + 1 < n) { S.i++; viewQuiz(); top(); } else finish();
    } else if (name === "prev") {
      if (S.i > 0) { S.i--; viewQuiz(); top(); }
    } else if (name === "flag") {
      S.flag[qi] = !S.flag[qi]; viewQuiz();
    } else if (name === "finish") {
      var unanswered = S.idx.filter(function (k) { return !(S.ans[k] || []).length; }).length;
      if (unanswered && !window.confirm(unanswered + " question" + (unanswered === 1 ? " is" : "s are") + " unanswered. Finish anyway?")) return;
      finish();
    } else if (name === "quit") {
      finish();
    }
  }

  // ---------- results ----------
  function finish() {
    if (!S || S.done) return;
    stopTimer();
    S.done = true;
    S.ended = Date.now();
    viewResults(true);
    top();
  }

  function viewResults(showMissedOnly) {
    var b = S.b;
    var practiceSeen = S.mode === "practice" ? S.idx.filter(function (k) { return S.checked[k]; }) : S.idx;
    var pool = S.mode === "practice" ? practiceSeen : S.idx;
    var total = pool.length;
    var correct = 0, missed = [];
    var per = {};
    b.domains.forEach(function (d) { per[d.id] = { right: 0, total: 0 }; });
    pool.forEach(function (k) {
      var q = b.questions[k];
      var ok = same(S.ans[k] || [], q.answer);
      per[q.domain].total++;
      if (ok) { correct++; per[q.domain].right++; } else missed.push(k);
    });
    if (!S.retry && total === b.questions.length) saveBest(b.id, correct, total);
    var pct = total ? Math.round(100 * correct / total) : 0;
    var minutes = Math.max(1, Math.round((S.ended - S.started) / 60000));

    var html = '<div class="narrow">' +
      '<p class="qhead"><span>' + esc(b.code) + ' <span class="mode">· ' + (S.mode === "timed" ? "Timed test" : (S.retry ? "Retry" : "Practice")) + ' results</span></span></p>';
    if (!total) {
      html += '<h1>No answers yet</h1><p class="lead">Answer at least one question to see a score.</p>' +
        '<div class="actions"><button class="btn btn-dark" data-start="' + b.id + '" data-mode="' + S.mode + '">Start again</button>' +
        '<a class="btn btn-ghost" href="./">All exams</a></div></div>';
      app.innerHTML = html;
      return;
    }
    html += '<p class="score">' + correct + ' / ' + total + '<small>' + pct + '%</small></p>' +
      '<p class="sub">' + (S.mode === "timed" ? "Finished in " + minutes + " minute" + (minutes === 1 ? "" : "s") + "." : "Practice run, " + total + " question" + (total === 1 ? "" : "s") + " checked.") + '</p>' +
      '<p class="fine">The real exam reports a scaled score from 100 to 1000 and passes at 720. Use this percentage to find your weak domains.</p>';

    html += '<section class="panel"><h2>By domain</h2>';
    b.domains.forEach(function (d) {
      var t = per[d.id];
      if (!t.total) return;
      var r = t.right / t.total;
      html += '<div class="drow"><span class="dname">' + esc(d.name) + '</span><span class="dnum">' + t.right + ' of ' + t.total + '</span>' +
        '<div class="bar" aria-hidden="true"><i class="' + (r >= 0.7 ? "good" : "weak") + '" style="width:' + Math.max(4, Math.round(100 * r)) + '%"></i></div>' +
        '<span class="dmeta">' + d.weight + '% of the exam' + (r < 0.7 ? ' · <a href="' + esc(d.guide) + '">Review this domain in the guide</a>' : '') + '</span></div>';
    });
    html += '</section>';

    html += '<section class="cta"><h2>Ready for full length?</h2>' +
      '<p>The ' + esc(b.code) + ' page on Preporato has free sample questions and full-length timed practice tests (paid) in the exam’s format, with a score for every domain.</p>' +
      '<a class="btn" href="' + esc(b.certPage) + '">Open the ' + esc(b.code) + ' practice tests ↗</a></section>';

    html += '<div class="actions">' +
      (missed.length ? '<button class="btn btn-dark btn-grow" data-act="retry">Retry the ' + missed.length + ' you missed</button>' : '') +
      '<button class="btn btn-ghost btn-grow" data-start="' + b.id + '" data-mode="' + (S.mode === "timed" ? "timed" : "practice") + '">Start over</button>' +
      '<a class="btn btn-ghost btn-grow" href="./">All exams</a></div>';

    var only = showMissedOnly && missed.length > 0;
    html += '<section class="review"><div class="review-head"><h2>Review</h2>' +
      (missed.length ? '<label class="toggle"><input type="checkbox" id="only-missed"' + (only ? " checked" : "") + '> Only the ones I missed</label>' : '') +
      '</div>';
    pool.forEach(function (k) {
      var q = b.questions[k];
      var yours = S.ans[k] || [];
      var ok = same(yours, q.answer);
      if (only && ok) return;
      var pos = S.idx.indexOf(k) + 1;
      html += '<details class="item"><summary><span class="mark ' + (ok ? "ok" : "bad") + '" aria-label="' + (ok ? "Correct" : "Incorrect") + '">' + (ok ? "✓" : "✗") + '</span>' +
        '<span class="q">' + pos + '. ' + rich(q.stem) + '</span></summary><div class="body">' +
        '<p class="yours">Your answer: ' + (yours.length ? joinLetters(yours.slice().sort()) : "none") + ' · Correct: ' + joinLetters(q.answer) + '</p>' +
        '<div class="opts">';
      q.options.forEach(function (o) {
        var cls = "opt locked";
        if (q.answer.indexOf(o.letter) >= 0) cls += " right";
        else if (yours.indexOf(o.letter) >= 0) cls += " wrong";
        html += '<div class="' + cls + '"><span class="let" aria-hidden="true">' + o.letter + '</span><span class="txt"><span class="sr-only">' + o.letter + '. </span>' + rich(o.text) + '</span></div>';
      });
      html += '</div><p class="exp">' + rich(q.explanation) + '</p></div></details>';
    });
    html += '</section></div>';
    app.innerHTML = html;
    S.missed = missed;
  }

  // ---------- events ----------
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.name === "opt" && S && !S.done) choose(t.value);
    if (t.id === "only-missed" && S) viewResults(t.checked);
  });
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-start],[data-act],[data-go]");
    if (!el) return;
    if (el.hasAttribute("data-start")) {
      start(el.getAttribute("data-start"), el.getAttribute("data-mode"));
    } else if (el.hasAttribute("data-go")) {
      S.i = Number(el.getAttribute("data-go")); viewQuiz(); top();
    } else {
      var a = el.getAttribute("data-act");
      if (a === "retry") start(S.b.id, "practice", S.missed.slice());
      else act(a);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (!S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea") return;
    var k = e.key.toLowerCase();
    var q = current();
    var map = { a: 0, b: 1, c: 2, d: 3, e: 4, "1": 0, "2": 1, "3": 2, "4": 3, "5": 4 };
    if (k in map && q.options[map[k]]) { e.preventDefault(); choose(q.options[map[k]].letter); return; }
    if (k === "enter" && tag !== "button" && tag !== "a") {
      e.preventDefault();
      var qi = S.idx[S.i];
      if (S.mode === "practice") act(S.checked[qi] ? "next" : "check");
      else act(S.i + 1 < S.idx.length ? "next" : "finish");
    }
  });
  window.addEventListener("beforeunload", function (e) {
    if (S && !S.done && Object.keys(S.ans).length) { e.preventDefault(); e.returnValue = ""; }
  });
  function route() {
    var id = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    if (S && !S.done && Object.keys(S.ans).length && !window.confirm("Leave this test? Your answers will be lost.")) return;
    if (id && BY_ID[id]) viewIntro(BY_ID[id]); else viewHome();
    top();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
