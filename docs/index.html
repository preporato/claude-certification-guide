<style>
:root {
  --paper: #F4F4F4; --card: #FFFFFF; --ink: #1A1D1F; --graphite: #33383F; --slate: #676767; --line: #E3E3E3; --line-strong: #C9C9C9;
  --blue: #2A85FF; --blue-deep: #0066F5; --blue-tint: #E8F3FF;
  --cta: #2C2C2C; --cta-hover: #000000; --cta-text: #FFFFFF;
  --ok: #2F7A3A; --ok-line: #83BF6E; --ok-tint: #EAFAE4;
  --bad: #B42318; --bad-line: #FF6A55; --bad-tint: #FFECE8;
  --flag: #FF6A55; --glow: #CC785C;
  --round: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #101010; --card: #191919; --ink: #F1F1F1; --graphite: #D9D9D9; --slate: #A3A3A3; --line: #2C2C2E; --line-strong: #444448;
    --blue-tint: #0F2440; --cta: #F1F1F1; --cta-hover: #FFFFFF; --cta-text: #101010;
    --ok: #7DD27F; --ok-tint: #11291A; --bad: #FF8A7A; --bad-tint: #36160F;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
a { color: var(--blue-deep); }
@media (prefers-color-scheme: dark) { a { color: #6FB0FF; } }
code { font-family: var(--mono); font-size: .86em; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: .08em .35em; border-radius: 5px; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 980px; margin: 0 auto; padding: 16px 20px; }
.brand { font: 800 16px/1.2 var(--round); color: var(--ink); text-decoration: none; letter-spacing: -.005em; }
.top-link { font: 600 14px/1.2 var(--sans); color: var(--graphite); text-decoration: none; white-space: nowrap; }
.top-link:hover, .brand:hover { color: var(--blue-deep); }
@media (max-width: 480px) { .top-link .long { display: none; } }
main { max-width: 980px; margin: 0 auto; padding: 8px 20px 48px; }
.narrow { max-width: 760px; margin: 0 auto; }
footer { max-width: 980px; margin: 0 auto; padding: 24px 20px 40px; color: var(--slate); font-size: 13px; border-top: 1px solid var(--line); }
footer a { color: inherit; }

h1 { font: 900 clamp(28px, 5vw, 40px)/1.12 var(--round); letter-spacing: -.012em; margin: 24px 0 12px; }
.lead { font-size: 18px; color: var(--graphite); max-width: 680px; margin: 0 0 28px; }
.note { color: var(--slate); font-size: 14px; margin: 28px 0 0; }

.grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 680px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.cover { position: relative; aspect-ratio: 16 / 6.4; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; background:
  radial-gradient(60% 85% at 50% 100%, color-mix(in srgb, var(--glow) 38%, transparent), transparent 72%),
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0 / 14px 14px,
  linear-gradient(#17171A, #0B0B0C); }
.cover b { font: 900 clamp(34px, 6vw, 46px)/1 var(--round); letter-spacing: -.01em; }
.cover span { margin-top: 10px; font: 600 11px/1.3 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: #A3CFFF; }
.card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h2 { font: 700 17px/1.35 var(--sans); margin: 0; }
.meta { margin: 0; color: var(--slate); font-size: 14px; }
.best { margin: 2px 0 0; font: 700 13px/1.4 var(--round); color: var(--ok); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 12px; }

.btn { appearance: none; border: 0; border-radius: 11px; min-height: 46px; padding: 0 18px; font: 600 15px/1 var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background-color .15s, border-color .15s, color .15s; }
.btn-dark { background: var(--cta); color: var(--cta-text); }
.btn-dark:hover { background: var(--cta-hover); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line-strong); }
.btn-ghost:hover { border-color: var(--graphite); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-grow { flex: 1 1 160px; }

.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 10px; font: 700 14px/1.2 var(--round); color: var(--graphite); }
.qhead .mode { color: var(--slate); font-weight: 700; }
.timer { font: 600 15px/1 var(--mono); padding: 7px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.timer.low { color: var(--bad); border-color: var(--bad-line); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.scenario { margin: 22px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.scenario summary { cursor: pointer; font: 800 14px/1.35 var(--round); }
.scenario p { margin: 8px 0 0; color: var(--graphite); font-size: 15px; }
.qlabel { margin: 26px 0 6px; font: 700 13px/1.4 var(--round); color: var(--slate); }
.qlabel b { color: var(--ink); }
.stem { font-size: 18px; line-height: 1.55; margin: 0 0 6px; font-weight: 500; }
pre { background: #0B0B0C; color: #E9E9E9; font: 500 13px/1.55 var(--mono); padding: 14px 16px; border-radius: 12px; overflow: auto; margin: 14px 0 6px; }
.hint { font: 700 13px/1.4 var(--round); color: var(--blue-deep); margin: 10px 0 0; }
@media (prefers-color-scheme: dark) { .hint { color: #6FB0FF; } }
.opts { border: 0; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.opt { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 13px 15px; background: var(--card); border: 1.5px solid var(--line); border-radius: 13px; cursor: pointer; transition: border-color .12s, background-color .12s; }
.opt:hover { border-color: var(--line-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
.let { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font: 800 14px/1 var(--round); color: var(--graphite); }
.multi .let { border-radius: 8px; }
.txt { padding-top: 4px; }
.opt.sel { border-color: var(--blue); background: var(--blue-tint); }
.opt.sel .let { background: var(--blue); border-color: var(--blue); color: #fff; }
.opt.right { border-color: var(--ok-line); background: var(--ok-tint); }
.opt.right .let { background: var(--ok-line); border-color: var(--ok-line); color: #10240F; }
.opt.wrong { border-color: var(--bad-line); background: var(--bad-tint); }
.opt.wrong .let { background: var(--bad-line); border-color: var(--bad-line); color: #fff; }
.opt.locked { cursor: default; }
.feedback { margin: 18px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.feedback h3 { margin: 0 0 6px; font: 800 16px/1.3 var(--round); }
.feedback h3.ok { color: var(--ok); }
.feedback h3.bad { color: var(--bad); }
.feedback p { margin: 0; color: var(--graphite); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
.nav { margin: 26px 0 0; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.nav p { margin: 0 0 10px; font: 700 13px/1.4 var(--round); color: var(--slate); }
.dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.dot { position: relative; height: 38px; border-radius: 9px; border: 1.5px solid var(--line-strong); background: transparent; color: var(--graphite); font: 700 13px/1 var(--round); cursor: pointer; }
.dot.done { background: var(--graphite); border-color: var(--graphite); color: var(--card); }
.dot.cur { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue) inset; }
.dot.flagged::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }

.score { font: 900 clamp(44px, 9vw, 64px)/1 var(--round); letter-spacing: -.02em; margin: 18px 0 4px; }
.score small { font-size: .42em; color: var(--slate); font-weight: 800; margin-left: 6px; letter-spacing: 0; }
.sub { color: var(--graphite); margin: 0 0 4px; }
.fine { color: var(--slate); font-size: 14px; margin: 0; }
.panel { margin: 24px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 8px; }
.panel h2 { font: 800 17px/1.3 var(--round); margin: 0 0 12px; }
.drow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.drow:first-of-type { border-top: 0; }
.dname { font-weight: 600; font-size: 15px; }
.dnum { font: 700 14px/1.4 var(--round); color: var(--graphite); text-align: right; }
.drow .bar { grid-column: 1 / -1; height: 8px; }
.drow .bar > i.good { background: var(--ok-line); }
.drow .bar > i.weak { background: var(--bad-line); }
.dmeta { grid-column: 1 / -1; font-size: 13px; color: var(--slate); }
.cta { margin: 24px 0 0; border-radius: 18px; overflow: hidden; color: #fff; padding: 24px 22px; background:
  radial-gradient(70% 120% at 85% 110%, color-mix(in srgb, var(--glow) 42%, transparent), transparent 70%),
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0 / 14px 14px,
  linear-gradient(#17171A, #0B0B0C); }
.cta h2 { font: 900 22px/1.2 var(--round); margin: 0 0 8px; }
.cta p { margin: 0 0 16px; color: #D6D6D6; max-width: 560px; }
.cta .btn { background: #fff; color: #101010; }
.cta .btn:hover { background: #EDEDED; }
.review { margin: 24px 0 0; }
.review-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.review-head h2 { font: 800 17px/1.3 var(--round); margin: 0; }
.toggle { font-size: 14px; color: var(--graphite); display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.item { margin: 10px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 13px; }
.item summary { list-style: none; cursor: pointer; padding: 13px 15px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
.item summary::-webkit-details-marker { display: none; }
.mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 900 13px/1 var(--round); }
.mark.ok { background: var(--ok-tint); color: var(--ok); }
.mark.bad { background: var(--bad-tint); color: var(--bad); }
.item .q { font-size: 15px; }
.item .body { padding: 0 15px 15px 51px; }
.item .opts { margin-top: 4px; }
.item .opt { cursor: default; padding: 10px 12px; }
.item .exp { margin: 12px 0 0; color: var(--graphite); }
.yours { font: 700 13px/1.4 var(--round); color: var(--slate); margin: 0 0 8px; }
@media (max-width: 520px) {
  .item .body { padding-left: 15px; }
  .stem { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="banks" type="application/json">[{"id":"ccao-f","code":"CCAO-F","name":"Claude Certified Associate - Foundations","certPage":"https://preporato.com/certificates/claude-certified-associate-foundations","guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md","exam":{"questions":70,"scored":60,"minutes":120},"minutes":51,"domains":[{"id":"d1","name":"Task Definition and Prompting","weight":15,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-1-task-definition-and-prompting-15"},{"id":"d2","name":"Output Evaluation and Quality Control","weight":20,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-2-output-evaluation-and-quality-control-20"},{"id":"d3","name":"Capability, Model, and Context Selection","weight":15,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-3-capability-model-and-context-selection-15"},{"id":"d4","name":"Workflow Design and Integration","weight":18,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-4-workflow-design-and-integration-18"},{"id":"d5","name":"Configuration and Knowledge Management","weight":15,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-5-configuration-and-knowledge-management-15"},{"id":"d6","name":"Responsible Use, Data Protection, and Governance","weight":17,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-6-responsible-use-data-protection-and-governance-17"}],"scenarios":[],"questions":[{"n":1,"domain":"d1","scenario":null,"stem":"Your prompt 'Write an email about the new expense tool' produced something generic. Which TWO additions would improve it most? (Select TWO)","code":null,"options":[{"letter":"A","text":"A switch to the most capable model at the highest effort level"},{"letter":"B","text":"A request for ten versions so that you can pick the best one of them"},{"letter":"C","text":"The tool's key facts, pasted in: launch date, how to get access, where to get help"},{"letter":"D","text":"An instruction to 'make it amazing' and to be as creative and engaging as it can"},{"letter":"E","text":"Who the email is for and what it should get them to do"}],"answer":["C","E"],"explanation":"Generic output comes from missing context, and the audience and goal (E) and the source material (C) are two of the five parts of a complete business prompt. Enthusiasm (D) adds no information. More versions (B) of an underspecified email are more generic emails. A stronger model (A) still can't know facts you didn't give it."},{"n":2,"domain":"d1","scenario":null,"stem":"You need a 20-page market analysis with competitor profiles, a pricing comparison and recommendations. One big prompt produced a shallow result. What is the best approach?","code":null,"options":[{"letter":"A","text":"Ask for 'much more detail' in every section of the same single prompt"},{"letter":"B","text":"Break it into steps: agree on an outline, draft each section from its sources, then do a final pass"},{"letter":"C","text":"Regenerate the same prompt until a deeper version of the analysis appears"},{"letter":"D","text":"Rewrite the single prompt with every requirement in capitals, so that Claude can't skip any of them"}],"answer":["B"],"explanation":"Multi-part deliverables work better as a sequence of smaller steps you can check (B). A and D keep the one-giant-prompt problem. C is regenerate-and-hope."},{"n":3,"domain":"d1","scenario":null,"stem":"Claude's first draft of a customer apology is too long and too formal. Which follow-up works best?","code":null,"options":[{"letter":"A","text":"'Please improve this draft and make it much better than the first one you wrote.'"},{"letter":"B","text":"Start a new chat and paste in the same prompt you used the first time"},{"letter":"C","text":"Regenerate the response and pick whichever of the versions reads better"},{"letter":"D","text":"'Cut this to about 120 words, warmer and more direct; keep the refund details and open with the apology.'"}],"answer":["D"],"explanation":"Specific feedback gives Claude concrete changes to make (D). A gives it nothing to act on, and C and B roll the dice again on an unchanged request."},{"n":4,"domain":"d1","scenario":null,"stem":"You want campaign ideas for a product launch. Which prompting strategy fits brainstorming?","code":null,"options":[{"letter":"A","text":"Ask for many varied ideas first (say, 20), then narrow them with your criteria in a follow-up"},{"letter":"B","text":"Ask for the single best idea, so you don't have to sort through a long list of them"},{"letter":"C","text":"Give no context at all, so Claude is unconstrained and free to surprise you"},{"letter":"D","text":"Ask for a short list of ideas with final budgets and timelines already attached to each one of them"}],"answer":["A"],"explanation":"Brainstorming works best as volume and variety first, then judgment (A). Asking for one best idea (B) skips the exploration. Budgets (D) belong to a later planning step. With no context (C), the ideas won't fit your product or audience."},{"n":5,"domain":"d1","scenario":null,"stem":"You asked for 'a table comparing vendors,' and each time the columns come out different. What is the most effective fix?","code":null,"options":[{"letter":"A","text":"Regenerate until the columns happen to come out the way you want them"},{"letter":"B","text":"Ask for 'a better, more professional table' with clearer columns"},{"letter":"C","text":"Show the exact structure: list the columns in order or paste a sample row to follow"},{"letter":"D","text":"Switch to Opus, which keeps its formatting far more consistent from one run to the next"}],"answer":["C"],"explanation":"A wrong format every time means the format was described vaguely, and a concrete example fixes that (C). A is regenerate-and-hope, D changes the model without clarifying the request, and B is still vague."},{"n":6,"domain":"d2","scenario":null,"stem":"Claude summarized a 30-page vendor contract you attached and wrote: 'The contract auto-renews for 24 months unless cancelled 90 days before expiry.' This line is going into an email to your director. What is the most efficient way to check it?","code":null,"options":[{"letter":"A","text":"Regenerate the summary and check whether the same line comes back a second time"},{"letter":"B","text":"Ask Claude to quote the exact clause with its section number, then read that clause yourself"},{"letter":"C","text":"Send it as is, because the contract was attached, so Claude worked from the actual contract text"},{"letter":"D","text":"Ask Claude whether it's sure, and send the summary if it confirms the line"}],"answer":["B"],"explanation":"A grounded claim can point to its evidence, so asking for the clause and reading it yourself is fast and conclusive (B). Asking for reassurance (D) gets a fluent answer either way. Consistency across regenerations (A) doesn't prove accuracy. An attached source (C) lowers the risk of errors without removing it, and this line describes a contract commitment."},{"n":7,"domain":"d2","scenario":null,"stem":"Claude drafted a job ad for a software engineer that uses phrases like 'young, energetic team' and 'digital native.' What is the issue, and what should you do?","code":null,"options":[{"letter":"A","text":"Nothing; phrases like these are standard in technology job ads and help the company attract a good cultural fit"},{"letter":"B","text":"The tone is too casual for a technical role; ask for a formal rewrite that sounds more professional"},{"letter":"C","text":"The ad is too long for job boards; ask for a shorter version that keeps the key requirements"},{"letter":"D","text":"It signals an age preference, which can deter qualified applicants and create legal risk; ask for inclusive wording"}],"answer":["D"],"explanation":"Evaluating output covers bias as well as factual errors, and age-coded language in a job ad is a real fairness and compliance problem (D). B and C change the style and keep the biased phrases. A confuses a common phrase with an acceptable one."},{"n":8,"domain":"d2","scenario":null,"stem":"Claude built a pricing comparison table with totals calculated from 40 line items you pasted in. The table is going into a client proposal. What validation is needed?","code":null,"options":[{"letter":"A","text":"Nothing, because you supplied the numbers and Claude only added them up"},{"letter":"B","text":"Round the totals so that any small differences in the arithmetic won't matter to the client"},{"letter":"C","text":"Recompute the totals independently, for example in a spreadsheet, before it goes out"},{"letter":"D","text":"Ask Claude to double-check its own math in the same chat, and fix anything it finds"}],"answer":["C"],"explanation":"Precise arithmetic over many figures is a weak fit to accept unchecked, and a client-facing proposal makes the numbers consequential, so they get verified independently (C). Next time, have Claude compute totals with code execution on the line items rather than in prose. The same process checking itself (D) isn't an independent check. Correct inputs (A) don't guarantee correct sums. Rounding (B) hides errors."},{"n":9,"domain":"d2","scenario":null,"stem":"Claude wrote a market summary with no sources attached. Which TWO details are hallucination red flags? (Select TWO)","code":null,"options":[{"letter":"A","text":"'According to a 2025 McKinsey survey, 73% of retailers...' with no source attached"},{"letter":"B","text":"A suggestion to verify the figures with the original sources before publishing"},{"letter":"C","text":"A general explanation of what market share means and how analysts measure it"},{"letter":"D","text":"A note that Claude can't see your internal sales data"},{"letter":"E","text":"A precise figure for next quarter's market size, stated as fact"}],"answer":["A","E"],"explanation":"A named study with a precise statistic and no source (A), and a confident, specific figure about the future (E), fit the red-flag profile: precision and authority without grounding. A general definition (C) is low risk, and B and D are signs of honest, calibrated output."},{"n":10,"domain":"d2","scenario":null,"stem":"Claude summarized a customer interview and wrote: 'The customer is frustrated with onboarding and plans to cancel.' The transcript mentions onboarding friction but says nothing about cancelling. What is the problem?","code":null,"options":[{"letter":"A","text":"It presents an inference as fact; edit it to what the transcript supports, or label it as interpretation"},{"letter":"B","text":"The summary needs a more formal, neutral tone before it is shared with the product team"},{"letter":"C","text":"The summary is too short to capture everything the customer said about onboarding"},{"letter":"D","text":"Nothing; it's a reasonable reading of the frustration that the customer described at length in the interview"}],"answer":["A"],"explanation":"Details beyond the source are a hallucination red flag, and a cancellation claim could trigger real business decisions, so the output has to match its evidence (A). A plausible reading (D) still isn't supported by the transcript. C and B are style issues."},{"n":11,"domain":"d2","scenario":null,"stem":"Research mode returns a summary of a new data regulation with eight cited sources. Your compliance team will base a plan on it. Which TWO steps are needed before anyone uses it? (Select TWO)","code":null,"options":[{"letter":"A","text":"Nothing; eight citations from different sources prove that the summary is accurate"},{"letter":"B","text":"Have the compliance owner review the conclusions before the plan is built on them"},{"letter":"C","text":"Ask Claude to rate the reliability of each source"},{"letter":"D","text":"Run research mode again and keep only the claims that appear in both of the summaries"},{"letter":"E","text":"Open the cited sources and confirm each key claim matches them, and that they're current and authoritative"}],"answer":["B","E"],"explanation":"Citations make claims checkable, which helps only if someone checks them (E), and regulatory content goes through a qualified reviewer (B). Citations alone (A) don't prove the summary represents its sources correctly. Repeated claims (D) show consistency, which isn't accuracy. Claude grading its own sources (C) is no independent check."},{"n":12,"domain":"d3","scenario":null,"stem":"Every month you turn a 9,000-row sales export into a two-page summary for regional managers, with exact totals by region and a short commentary. Which setup fits?","code":null,"options":[{"letter":"A","text":"Research mode, so that every figure in the summary comes with a citation you can check"},{"letter":"B","text":"The most capable model at the highest effort, so the arithmetic in the prose is accurate every month"},{"letter":"C","text":"Paste all 9,000 rows into a chat and ask Claude to add up each region and then write the short commentary"},{"letter":"D","text":"Code execution on the uploaded export for exact totals, with the summary as an Artifact you can revise"}],"answer":["D"],"explanation":"Exact figures from a data file are the code-execution trigger, and a document you will revise and share is the Artifact trigger (D). Totals written out in prose (C) are estimates. Research (A) searches outside sources and has nothing to do with your export. A stronger setting (B) still produces arithmetic in prose; computation that must be exact belongs in code."},{"n":13,"domain":"d3","scenario":null,"stem":"Which TWO tasks justify Opus over Sonnet? (Select TWO)","code":null,"options":[{"letter":"A","text":"Writing a two-line reply to a colleague who asked whether the quarterly report will be ready on time"},{"letter":"B","text":"A strategy recommendation synthesizing six long reports, where an error would be expensive"},{"letter":"C","text":"Reformatting a list of 30 names and email addresses into a sortable table"},{"letter":"D","text":"Working out how obligations interact across five related contracts before a negotiation"},{"letter":"E","text":"Summarizing the notes from a short weekly team meeting"}],"answer":["B","D"],"explanation":"Opus is for complex, high-stakes reasoning across a lot of material (B, D). Sonnet is the everyday default, and quick, simple tasks like C, A and E suit Sonnet or Haiku."},{"n":14,"domain":"d3","scenario":null,"stem":"You need to sort 400 short customer comments into five well-defined themes today. Speed matters more than nuance. Which approach fits?","code":null,"options":[{"letter":"A","text":"Haiku with the five themes clearly defined, then a spot-check of a sample"},{"letter":"B","text":"Opus at the highest effort, for maximum quality on every one of the comments"},{"letter":"C","text":"Research mode, so each theme is backed by sources from outside the company"},{"letter":"D","text":"One comment per chat, so each of the 400 comments gets Claude's full attention"}],"answer":["A"],"explanation":"Quick, well-defined tasks at volume are Haiku's case, and a sample check keeps the quality honest (A). Opus (B) spends time and cost on a task that doesn't need deep reasoning. Research mode (C) searches for current sources, which this task doesn't need. D wastes hours."},{"n":15,"domain":"d3","scenario":null,"stem":"A long chat about a proposal has become slow, and Claude has started mixing up details from early drafts with the current version. What is the best move?","code":null,"options":[{"letter":"A","text":"Keep going in the same chat and correct each mistake as soon as it appears in a draft"},{"letter":"B","text":"Paste the entire chat history into a new chat, so that nothing from any of the earlier drafts is lost along the way"},{"letter":"C","text":"Start fresh with a summary of current decisions and the latest draft, and keep references in Project knowledge"},{"letter":"D","text":"Switch to Haiku for speed, since the slowdown is the main problem with the long chat"}],"answer":["C"],"explanation":"Restart, summarize and persist is the fix for an overloaded chat: a fresh context with only what matters (C). A keeps the overload, B moves it to a new chat, and D changes speed without fixing the mix-ups."},{"n":16,"domain":"d4","scenario":null,"stem":"Your manager wants to roll Claude out to all 200 employees next week for every kind of task. What do you recommend?","code":null,"options":[{"letter":"A","text":"Wait until AI tools stop making mistakes, so no one has to check the outputs they produce"},{"letter":"B","text":"Pilot one or two well-defined workflows with a small group, measure time and errors before and after, then expand"},{"letter":"C","text":"Let each employee figure out their own uses without guidance, since everyone's work is different"},{"letter":"D","text":"Roll it out to all 200 employees at once next week, to build momentum and show that leadership supports it"}],"answer":["B"],"explanation":"A measured pilot shows the real value and the limits on a small scale before the whole company depends on it (B). A big-bang rollout (D) spreads untested habits everywhere at once. A waits for something that won't happen. C produces uneven quality and no evidence."},{"n":17,"domain":"d4","scenario":null,"stem":"Which TWO tasks are strong fits for Claude in a marketing team's workflow? (Select TWO)","code":null,"options":[{"letter":"A","text":"Turning a webinar transcript into a blog draft and three social posts"},{"letter":"B","text":"Reconciling 5,000 ad-spend transactions with no independent check"},{"letter":"C","text":"Deciding which agency gets a $200,000 contract"},{"letter":"D","text":"Drafting five subject-line variants for an A/B test"},{"letter":"E","text":"Reporting a competitor's announcement from yesterday, from memory"}],"answer":["A","D"],"explanation":"Drafting variants (D) and repurposing content across channels (A) are classic strong fits, with a person reviewing the output. A spending decision (C) needs human accountability, precise reconciliation at volume (B) belongs in a spreadsheet or finance system, and yesterday's news (E) is beyond the model's knowledge unless research mode grounds it."},{"n":18,"domain":"d4","scenario":null,"stem":"You're presenting a Claude pilot to leadership. Which framing is most appropriate?","code":null,"options":[{"letter":"A","text":"'Claude will replace the operations team by next year, which will save the company its entire annual salary budget.'"},{"letter":"B","text":"'The benefits are real, but they can't really be measured in time or in quality.'"},{"letter":"C","text":"'Summaries take 10 minutes instead of 45; the owner still reviews each one, since outputs can contain errors.'"},{"letter":"D","text":"'Claude eliminates errors from our summaries, so they no longer need anyone to review them.'"}],"answer":["C"],"explanation":"Good stakeholder communication pairs a concrete, measured benefit with an honest limitation (C). D promises something no probabilistic system delivers. A overstates the role and invites resistance. B gives leadership nothing to decide with."},{"n":19,"domain":"d4","scenario":null,"stem":"A colleague opens Claude and types 'help me with the Q3 board deck.' The results are unfocused. What should be defined before prompting?","code":null,"options":[{"letter":"A","text":"The deliverable, its audience, the source material, and what a good result looks like"},{"letter":"B","text":"The slide color scheme, the fonts, the template, and how many slides the deck should have"},{"letter":"C","text":"Nothing; Claude should infer it from the name of the deck and the quarter"},{"letter":"D","text":"Which model to use, and whether to turn on extended thinking for it"}],"answer":["A"],"explanation":"Solution design starts from the task: what you need, for whom, from which sources, and how you'll judge it (A). Model choice (D) comes later and won't rescue an undefined task. Claude can't infer goals nobody has stated (C). Colors (B) are a detail of the deliverable."},{"n":20,"domain":"d4","scenario":null,"stem":"A legal team handles NDAs in five steps: intake, first-pass review against the team's playbook, negotiation, approval and signature. Where does Claude add the most value with the right safeguards?","code":null,"options":[{"letter":"A","text":"Negotiating directly with the other party, unsupervised, so that each deal closes faster"},{"letter":"B","text":"Signing on the company's behalf once the NDA has been reviewed and approved"},{"letter":"C","text":"Final approval, since Claude can check the whole NDA faster than a lawyer can"},{"letter":"D","text":"First-pass review: compare each NDA with the playbook and flag deviations for a lawyer"}],"answer":["D"],"explanation":"First-pass review is a good human-reviewed step: Claude compares and flags, and a lawyer decides on each deviation (D). Approval (C), signature (B) and negotiation with the other party (A) are human-retained steps that carry legal accountability, and handing them to Claude is over-delegation."},{"n":21,"domain":"d5","scenario":null,"stem":"In a team Project, where should each of these go: (1) 'Always write in British English and use our headline format'; (2) the 40-page brand guidelines PDF; (3) the team's seven-step procedure for turning a brief into a campaign one-pager in the standard template; (4) the brief for this week's campaign?","code":null,"options":[{"letter":"A","text":"(1) Project instructions, (2) a Skill, (3) Project instructions, (4) Project knowledge"},{"letter":"B","text":"(1) Project instructions, (2) Project knowledge, (3) a Skill, (4) the chat prompt"},{"letter":"C","text":"(1) Project knowledge, (2) Project instructions, (3) the chat prompt, (4) a Skill"},{"letter":"D","text":"(1) The chat prompt, (2) the chat prompt, (3) Project knowledge, (4) Project instructions"}],"answer":["B"],"explanation":"Standing rules go in instructions, reference documents in knowledge, a repeatable procedure with a template in a Skill, and details for one task in the chat (B). C swaps rules and documents, retypes the procedure every time and makes a one-week brief permanent. D retypes standing rules in every chat and stores a temporary brief as a permanent rule. A packages a reference PDF as a procedure and stores the temporary brief permanently."},{"n":22,"domain":"d5","scenario":null,"stem":"Your weekly report draws on a Google Doc of sales notes that the team updates daily. You've been uploading a copy every Monday, and sometimes it's out of date. What is the better setup?","code":null,"options":[{"letter":"A","text":"Paste the notes in from memory at the start of each week's report"},{"letter":"B","text":"Upload a fresh copy twice a week instead of once, on Mondays and Thursdays"},{"letter":"C","text":"Copy the notes into the Project instructions, which Claude reads in every chat"},{"letter":"D","text":"Connect Google Drive so Claude reads the current version of the document"}],"answer":["D"],"explanation":"Connectors suit material that lives in another tool and changes often, so Claude reads the current version (D). More frequent uploads (B) shrink the gap without closing it. Memory (A) adds errors. Instructions (C) hold standing rules, and pasted notes there go stale just as fast."},{"n":23,"domain":"d5","scenario":null,"stem":"A Project keeps quoting last year's prices. Both the 2025 and the 2026 price sheets are in Project knowledge. What fixes this?","code":null,"options":[{"letter":"A","text":"Remove or replace the outdated sheet; if both must stay, say in the instructions which one is current"},{"letter":"B","text":"Use research mode for prices, so that Claude searches the web for the current figures each time it needs one"},{"letter":"C","text":"Correct Claude in every chat whenever it quotes one of last year's prices"},{"letter":"D","text":"Switch to Opus, which is better at telling which of two documents is newer"}],"answer":["A"],"explanation":"Stale knowledge produces confidently outdated answers, so the fix is maintaining the knowledge itself (A). Correcting every chat (C) never ends. A stronger model (D) still reads both sheets. Your prices are internal, so searching for them (B) won't find the right ones."},{"n":24,"domain":"d5","scenario":null,"stem":"A consultant runs all client work in one Project with memory on. This week, a draft for Client A mentioned the internal codename of Client B's project. The instructions and knowledge files haven't changed. What is the right fix?","code":null,"options":[{"letter":"A","text":"Remove Client B's files from Project knowledge, so that Claude can no longer read them"},{"letter":"B","text":"Switch to a more capable model that keeps different clients' details apart more reliably"},{"letter":"C","text":"Delete the memories about Client B, and give each client its own Project so memory stays scoped to one client"},{"letter":"D","text":"Add an instruction telling Claude never to mention other clients' names, codenames, or projects in any of its drafts"}],"answer":["C"],"explanation":"Details from another work stream are the signature of memory accumulated across clients, so the fix is to clean that memory and separate the work streams (C). An instruction (D) papers over context that shouldn't be shared at all. A stronger model (B) doesn't change what Claude remembers. The knowledge files (A) haven't changed, so they can't explain the new behavior."},{"n":25,"domain":"d5","scenario":null,"stem":"On Monday you changed a Project's instructions, switched the model and uploaded new knowledge files. Since then, the outputs are worse. What should you do?","code":null,"options":[{"letter":"A","text":"Ask Claude what went wrong, since it can see its own instructions and knowledge"},{"letter":"B","text":"Roll back, then reapply one change at a time, comparing results on the same test inputs"},{"letter":"C","text":"Delete the Project and start over with a fresh setup built from scratch this week"},{"letter":"D","text":"Change everything again until the outputs are as good as they were before Monday"}],"answer":["B"],"explanation":"With three changes at once, you can't tell which one hurt quality, so change one variable at a time against the same inputs (B). D adds more confusion, A asks Claude to explain configuration changes it can't observe, and C throws away a setup that worked before Monday."},{"n":26,"domain":"d6","scenario":null,"stem":"You want Claude to summarize an internal incident report that contains customers' names and email addresses. Your company's AI policy allows internal documents and prohibits customer personal data. What do you do?","code":null,"options":[{"letter":"A","text":"Paste it in, because the policy allows internal documents and this report is an internal one"},{"letter":"B","text":"Paste it in and ask Claude to ignore the names"},{"letter":"C","text":"De-identify the customer details first, since the summary doesn't need them, then summarize"},{"letter":"D","text":"Paste it into an incognito chat, since incognito chats aren't saved to history or memory"}],"answer":["C"],"explanation":"Check the policy before pasting: the report is allowed, the customer data isn't, and the task works without it (C). Being internal (A) doesn't change the personal-data rule. Incognito (D) controls what is kept afterwards, but the data has still been shared. Asking Claude to ignore data (B) comes after you've already shared it."},{"n":27,"domain":"d6","scenario":null,"stem":"A sales rep wants to upload a prospect's RFP, marked confidential, so Claude can help draft the response. Your AI policy says nothing about third-party confidential documents. What is the best action?","code":null,"options":[{"letter":"A","text":"Ask the policy owner or legal before uploading, and treat the RFP as sensitive until they answer"},{"letter":"B","text":"Rewrite the RFP from memory in your own words and upload that version instead of the file"},{"letter":"C","text":"Upload it, since the policy doesn't forbid it and the prospect wants a fast response"},{"letter":"D","text":"Upload only the pages that look less sensitive, and keep the pricing pages out of it"}],"answer":["A"],"explanation":"When the policy doesn't cover a case, escalate to the policy owner and stay on the cautious side in the meantime (A). Silence in the policy (C) doesn't amount to approval. Partial uploads (D) and paraphrasing from memory (B) still share confidential content, and the rewrite adds errors."},{"n":28,"domain":"d6","scenario":null,"stem":"Your organization requires disclosure when AI helps produce external content. You drafted a customer newsletter with Claude and then edited it heavily. What applies?","code":null,"options":[{"letter":"A","text":"Describe the newsletter as written and fact-checked by the team without help from AI"},{"letter":"B","text":"Skip disclosure, because your heavy edits have made the newsletter substantially your own original work"},{"letter":"C","text":"Disclose AI involvement only if a customer asks how the newsletter was written"},{"letter":"D","text":"Follow the disclosure rule as written, since your edits don't change how the draft was produced"}],"answer":["D"],"explanation":"Transparency rules apply as written (D). Editing (B) doesn't remove the requirement, disclosure on request (C) isn't what the policy says, and A misrepresents how the work was made."},{"n":29,"domain":"d6","scenario":null,"stem":"Which TWO uses make Claude the decision-maker in a situation where a qualified person must own the call? (Select TWO)","code":null,"options":[{"letter":"A","text":"Using Claude's ranking alone to decide which employees are laid off"},{"letter":"B","text":"Brainstorming names for a team offsite"},{"letter":"C","text":"Summarizing your own meeting notes"},{"letter":"D","text":"Drafting three versions of an internal FAQ for a manager to choose from"},{"letter":"E","text":"Sending Claude's answer about a customer's legal rights to the customer without legal review"}],"answer":["A","E"],"explanation":"Decisions that affect people's livelihoods (A) or legal standing (E) need a qualified human to own them, however good the draft looks. D, B and C are drafting and organizing work where a person still chooses what to use."},{"n":30,"domain":"d6","scenario":null,"stem":"A colleague found a free third-party Skill online that promises to summarize any contract, and wants to add it to the legal team's Project, which has the Google Drive connector enabled. What should happen first?","code":null,"options":[{"letter":"A","text":"Install it, but turn off the Google Drive connector while the team is testing it on a few contracts"},{"letter":"B","text":"Vet it like any software touching company data: publisher, what it does with files, policy; then get approval"},{"letter":"C","text":"Install it if its reviews are good and other legal teams have used it without any problems"},{"letter":"D","text":"Install it, since Skills only change how Claude formats output and can't reach the connected files"}],"answer":["B"],"explanation":"Trust in third-party Skills and connectors is part of judging whether a use is appropriate, so it gets vetted and approved before it touches legal files (B). Skills can carry instructions and code, so they do more than format output (D). Turning the connector off for a test (A) skips the question of what happens when it is on. Reviews (C) say nothing about your organization's policy or data."}]},{"id":"ccdv-f","code":"CCDV-F","name":"Claude Certified Developer - Foundations","certPage":"https://preporato.com/certificates/claude-certified-developer-foundations","guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md","exam":{"questions":70,"scored":60,"minutes":120},"minutes":51,"domains":[{"id":"d1","name":"Agents and Workflows","weight":17,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-1-agents-and-workflows-17"},{"id":"d2","name":"Applications and Integration","weight":20,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-2-applications-and-integration-20"},{"id":"d3","name":"Claude Code","weight":8,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-3-claude-code-8"},{"id":"d4","name":"Eval, Testing, and Debugging","weight":10,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-4-eval-testing-and-debugging-10"},{"id":"d5","name":"Model Selection and Optimization","weight":12,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-5-model-selection-and-optimization-12"},{"id":"d6","name":"Prompt and Context Engineering","weight":15,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-6-prompt-and-context-engineering-15"},{"id":"d7","name":"Security and Safety","weight":8,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-7-security-and-safety-8"},{"id":"d8","name":"Tools and MCP","weight":10,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-8-tools-and-mcp-10"}],"scenarios":[],"questions":[{"n":1,"domain":"d1","scenario":null,"stem":"A team wants an autonomous agent to convert CSV exports into a fixed JSON layout. The column mapping never changes. What is the best approach?","code":null,"options":[{"letter":"A","text":"A manager agent with three subagents that each convert a third of the columns"},{"letter":"B","text":"An orchestration framework with a state graph that tracks each file's progress"},{"letter":"C","text":"An Agent SDK agent with file tools, so that it can read each export and write out the JSON"},{"letter":"D","text":"A deterministic script, or one model call with a schema where a field needs interpretation"}],"answer":["D"],"explanation":"Apply the four-question test: the task isn't complex, its path is fully known, and code can avoid errors cheaply, so autonomy only adds cost and unpredictability (D). C, A and B each add machinery the problem doesn't need."},{"n":2,"domain":"d1","scenario":null,"stem":"Which TWO things does the Claude Agent SDK give you that you would otherwise build yourself in a custom loop? (Select TWO)","code":null,"options":[{"letter":"A","text":"A hosted vector database for retrieval over your project's own documents"},{"letter":"B","text":"A visual drag-and-drop designer for building the agent's workflow"},{"letter":"C","text":"Automatic fine-tuning of the model on your agent's traces"},{"letter":"D","text":"The agent loop with built-in tools for files, shell commands and search"},{"letter":"E","text":"Context management, plus hooks and permissions for deterministic control"}],"answer":["D","E"],"explanation":"The Agent SDK packages the same harness Claude Code runs on: the loop and built-in tools (D), plus context management, hooks, permissions and subagents (E). It doesn't host a vector database (A), fine-tune models (C) or provide a visual designer (B)."},{"n":3,"domain":"d1","scenario":null,"stem":"A bank's agent must keep all code execution and data inside its own network for data-residency rules. A startup wants the fastest path to production. Which deployment fits each?","code":null,"options":[{"letter":"A","text":"Self-hosted for both"},{"letter":"B","text":"Self-hosted for the bank, managed for the startup"},{"letter":"C","text":"Managed for the bank, self-hosted for the startup"},{"letter":"D","text":"Managed for both"}],"answer":["B"],"explanation":"Residency and custom-runtime requirements point to self-hosted execution, and speed to production points to a managed deployment where the provider runs the loop and the sandbox (B). D puts the bank's data outside its network. A slows the startup down for a requirement it doesn't have. C reverses both."},{"n":4,"domain":"d1","scenario":null,"stem":"An agent must summarize 12 long PDFs independently, then write a comparison across them. The single-agent version runs out of context. What is the best design?","code":null,"options":[{"letter":"A","text":"One agent reads all 12 PDFs in sequence in a single context, summarizing each one before moving to the next"},{"letter":"B","text":"Raise `max_tokens` on the single agent so it has room for all twelve summaries and the comparison"},{"letter":"C","text":"Give each PDF to a parallel subagent with its own context, and compare their summaries in an orchestrator"},{"letter":"D","text":"Twelve agents, one per PDF, that send their findings to each other directly and agree on the comparison"}],"answer":["C"],"explanation":"The summaries are independent subtasks, so isolated subagent contexts fit, and only compact reports return to the orchestrator (C). A is the design that already failed. `max_tokens` (B) limits output, and the problem is input. Agents talking to each other directly (D) remove the coordinator that merges results and isolates failures."},{"n":5,"domain":"d1","scenario":null,"stem":"A coding agent built on the Claude Agent SDK must run the project's linter after every file edit. The system prompt says 'Always run the linter after you edit a file.' Traces show it skips the linter in about one run in ten, mostly late in long sessions. Which change makes the requirement hold?","code":null,"options":[{"letter":"A","text":"A hook that runs the linter after every edit tool call, so it runs as code, not at the model's discretion"},{"letter":"B","text":"Add few-shot examples to the prompt that show the agent running the linter after each edit"},{"letter":"C","text":"Raise the effort level so the agent plans more carefully and follows its instructions more closely"},{"letter":"D","text":"Repeat the instruction in capitals at the end of the system prompt, which is where the model reads it last"}],"answer":["A"],"explanation":"A required action shouldn't depend on the model remembering it; a post-edit hook runs every time (A). Emphasis (D), examples (B) and more reasoning (C) all make the step more likely, and none makes it certain, which is what the requirement asks for."},{"n":6,"domain":"d2","scenario":null,"stem":"A chatbot sends only the newest user message to the API on each turn. Users complain that it forgets what they said two messages earlier. What fixes this?","code":null,"options":[{"letter":"A","text":"Send the conversation history, alternating user and assistant turns, with every request"},{"letter":"B","text":"Switch to a model with a larger context window that can hold more of the conversation"},{"letter":"C","text":"Raise `max_tokens` so there is room in each response to refer back to earlier messages"},{"letter":"D","text":"Enable prompt caching, so the earlier turns of the conversation are remembered between requests"}],"answer":["A"],"explanation":"The Messages API is stateless: the history you send is the model's entire memory of the conversation (A). Caching (D) makes repeated prefixes cheaper and faster, and it only applies to content you actually send. `max_tokens` (C) limits output length. A larger window (B) is useless when the earlier turns are never included."},{"n":7,"domain":"d2","scenario":null,"stem":"Which `stop_reason` tells you the response ended because it filled the model's context window, as opposed to hitting the `max_tokens` value you set?","code":null,"options":[{"letter":"A","text":"`max_tokens`"},{"letter":"B","text":"`end_turn`"},{"letter":"C","text":"`model_context_window_exceeded`"},{"letter":"D","text":"`pause_turn`"}],"answer":["C"],"explanation":"C means the response ran into the model's context window limit. A means it hit your own `max_tokens` cap. D means a server-side tool loop paused and should be continued, and B means Claude finished naturally. The first two both mean the output may be incomplete and shouldn't be parsed as a finished answer."},{"n":8,"domain":"d2","scenario":null,"stem":"Which TWO problems does streaming solve? (Select TWO)","code":null,"options":[{"letter":"A","text":"Users waiting several seconds for the first words of a chat reply"},{"letter":"B","text":"HTTP timeouts on requests with very large `max_tokens` values"},{"letter":"C","text":"Answers that contain factual errors"},{"letter":"D","text":"High token prices on long outputs, since streamed tokens are billed at a lower rate"},{"letter":"E","text":"Rate-limit errors during traffic peaks"}],"answer":["A","B"],"explanation":"Streaming sends tokens as they're generated, which shortens perceived latency (A) and keeps long-running requests alive instead of waiting on one large response (B). It doesn't change token pricing (D), accuracy (C) or rate limits (E)."},{"n":9,"domain":"d2","scenario":null,"stem":"Your app sends a different subset of 30 tools on each request depending on the user's plan, and the order of the tool list varies between requests. The system prompt is identical every time, yet the cache hit rate is near zero. Why?","code":null,"options":[{"letter":"A","text":"Requests that include tool definitions can't be cached, so only the messages after them are stored"},{"letter":"B","text":"The system prompt must be placed before the tools in the request, or the system prompt can't be cached at all"},{"letter":"C","text":"The 5-minute cache lifetime is too short for this traffic and needs to move to the 1-hour option"},{"letter":"D","text":"Tools lead the cache prefix, so a changing tool list or order breaks it; send one stable, ordered list per plan"}],"answer":["D"],"explanation":"The cache is a prefix match in a fixed order (tools, then system, then messages), so a changing tool list breaks the prefix at its very start (D). The order of those sections isn't yours to choose (B), tools are cacheable (A), and a longer lifetime (C) doesn't help a prefix that never repeats."},{"n":10,"domain":"d2","scenario":null,"stem":"Your batch job writes results to the database in the order they come back, pairing each with the input at the same position. Some records end up with another record's classification. Why?","code":null,"options":[{"letter":"A","text":"Sampling makes the classifications non-deterministic, so some labels change between runs"},{"letter":"B","text":"Results can come back in any order; match each one to its request by `custom_id`"},{"letter":"C","text":"The batch expired before all of its requests finished, so later results shifted position"},{"letter":"D","text":"Results are only kept for 29 days, after which older records lose their labels"}],"answer":["B"],"explanation":"Results aren't guaranteed to follow request order, which is why every request carries a `custom_id` (B). An expired batch (C) produces 'expired' results, which wouldn't swap labels between records. Non-determinism (A) can change a label but doesn't explain systematic mismatches. Retention (D) is unrelated."},{"n":11,"domain":"d2","scenario":null,"stem":"A downstream parser broke after your model outputs changed format overnight. Nobody touched the code. Which TWO practices prevent this kind of silent change? (Select TWO)","code":null,"options":[{"letter":"A","text":"Always call the newest model alias, so production picks up every improvement automatically"},{"letter":"B","text":"Pin a specific model version in production and upgrade on purpose after running evals"},{"letter":"C","text":"Keep prompts under version control (or in a prompt registry) and run evals before changing them"},{"letter":"D","text":"Edit prompts directly in production for speed, so that fixes reach users the same day"},{"letter":"E","text":"Add retries around the parser"}],"answer":["B","C"],"explanation":"Pinning (B) keeps model behavior fixed until you choose to move, and versioned prompts (C) make every behavior change reviewable and revertible. A floating alias (A) and direct production edits (D) are how silent changes happen. Retries (E) repeat the same broken output."},{"n":12,"domain":"d3","scenario":null,"stem":"Which files should hold a team's shared Claude Code permission rules (for example, allowing `Bash(npm run test *)`) and one developer's personal overrides for the same project?","code":null,"options":[{"letter":"A","text":"`~/.claude/settings.json` for the team; the project's `.claude/settings.json` for the developer's own overrides"},{"letter":"B","text":"`CLAUDE.md` for both, with the developer's overrides in a section at the end"},{"letter":"C","text":"Committed `.claude/settings.json` for the team; gitignored `.claude/settings.local.json` for the developer"},{"letter":"D","text":"`.mcp.json` for the team, and `CLAUDE.local.md` in the project root for the developer"}],"answer":["C"],"explanation":"The project settings file is shared through version control, and the local settings file holds personal overrides for that project without being committed (C). User-level settings (A) apply to one person across all projects. `CLAUDE.md` files (B, D) hold instructions, while permissions are enforced from settings files, and `.mcp.json` configures MCP servers."},{"n":13,"domain":"d3","scenario":null,"stem":"A platform team has a proven Claude Code setup: a code-review Skill, a security-review subagent, a hook that blocks pushes to main, and an internal MCP server. Forty product teams in separate repositories should install it and receive updates. What is the best way to distribute it?","code":null,"options":[{"letter":"A","text":"Document the setup on the wiki and let each team rebuild it to suit its own repository"},{"letter":"B","text":"A versioned plugin in an internal marketplace, so teams install it once and receive updates"},{"letter":"C","text":"Copy the files into each repository's `.claude/` folder, so every team has its own setup"},{"letter":"D","text":"Put the files in each developer's user-level `~/.claude/` folder through an onboarding script"}],"answer":["B"],"explanation":"A plugin bundles skills, subagents, hooks and MCP servers as one installable unit with versions, and a marketplace handles distribution and updates (B). Copies in forty repositories (C) drift apart with every change. A wiki (A) depends on forty teams rebuilding it correctly. User-level folders (D) reach one machine at a time and nothing in the repository."},{"n":14,"domain":"d4","scenario":null,"stem":"Your test suite checks that the model's summary exactly equals a stored 'golden' string, and the tests keep flaking. What is a better approach?","code":null,"options":[{"letter":"A","text":"Assert on structure and key facts (valid schema, required fields, must-have figures) or grade with a rubric"},{"letter":"B","text":"Retry each test until the output matches the golden string, then record a pass"},{"letter":"C","text":"Delete the flaky tests and rely on manual review of a few outputs before each release"},{"letter":"D","text":"Set temperature to 0 and keep exact string matching, since that makes the model's outputs fully deterministic"}],"answer":["A"],"explanation":"Sampled outputs vary between runs, so tests should check what matters about an output instead of its exact wording (A). Temperature 0 (D) is not a plan: the newest models reject sampling parameters with a 400, and where temperature 0 was accepted it reduced variation without guaranteeing identical text. Retrying until a pass (B) hides real regressions, and deleting tests (C) removes the safety net."},{"n":15,"domain":"d4","scenario":null,"stem":"After you add a new tool named `get order status`, every request returns 400 `invalid_request_error`. What is the first move?","code":null,"options":[{"letter":"A","text":"Retry with exponential backoff, since a newly added tool can take a few minutes to register"},{"letter":"B","text":"Rewrite the system prompt to explain the new tool and when the agent should call it"},{"letter":"C","text":"Switch to a different model that supports more flexible tool names in its requests"},{"letter":"D","text":"Fix the request: tool names can't contain spaces, so rename it (for example, `get_order_status`)"}],"answer":["D"],"explanation":"A 400 is a client error caused by the request itself, and a tool name with spaces breaks the documented pattern `^[a-zA-Z0-9_-]{1,128}$` (D). Retries (A) repeat the same invalid request. The model (C) and the prompt (B) play no part in request validation."},{"n":16,"domain":"d4","scenario":null,"stem":"A team grades chatbot replies with an LLM judge on a 1-5 helpfulness rubric. Compared with 200 human-labeled replies, the judge agrees with people on short replies but rates long replies about a point higher than they do. What should the team do before trusting the scores?","code":null,"options":[{"letter":"A","text":"Average the judge's scores with those of a second judge model, so that the length bias is diluted"},{"letter":"B","text":"Switch the judge to a larger, more capable model and start using its scores in the release gate right away"},{"letter":"C","text":"Revise the rubric and judge prompt to score what matters regardless of length, then re-measure agreement"},{"letter":"D","text":"Replace the rubric with an exact-match comparison against stored reference answers"}],"answer":["C"],"explanation":"The human labels expose a length bias, so the fix is a calibrated judge: change the rubric, then check agreement again (C). Averaging two judges (A) can average the same bias. A larger model (B) may still be biased, and skipping the re-measure means nobody knows. Exact match (D) can't grade helpfulness, because good replies vary in wording."},{"n":17,"domain":"d5","scenario":null,"stem":"A team's monthly API bill doubled, and evals show quality is fine. Which TWO levers should they try before downgrading the model tier? (Select TWO)","code":null,"options":[{"letter":"A","text":"Raise `max_tokens` so fewer responses get cut off"},{"letter":"B","text":"Send all traffic, live chat included, through the Batch API"},{"letter":"C","text":"Cache the stable prefix (tools and system prompt)"},{"letter":"D","text":"Trim context: drop stale tool outputs and history the model no longer needs"},{"letter":"E","text":"Move all traffic to the fast tier today"}],"answer":["C","D"],"explanation":"Trimming (D) and caching (C) cut cost without touching the model, so they come before a tier change, which should only happen with eval evidence (E). Batch (B) fits only work nobody is waiting for. A higher `max_tokens` (A) can raise spend."},{"n":18,"domain":"d5","scenario":null,"stem":"A coding agent on a model that supports the effort parameter works well but runs slowly and uses many tokens on routine refactors. Evals show quality holds at a lower effort level for those tasks. What should change?","code":null,"options":[{"letter":"A","text":"Raise effort to `max` on every request so refactors finish in fewer turns"},{"letter":"B","text":"Lower `output_config.effort` for routine refactors; keep a higher level for hard tasks"},{"letter":"C","text":"Set `max_tokens` to 512 for every request so no response can run long"},{"letter":"D","text":"Switch to a smaller model for every task without testing it, since refactors are simple"}],"answer":["B"],"explanation":"Effort controls how many tokens Claude spends across the whole response, thinking and tool calls included, without changing models, and the evals already show the lower level holds (B). D skips the evidence step. A hard cap (C) truncates work midway. Maximum effort (A) adds tokens and latency, the opposite of the goal."},{"n":19,"domain":"d5","scenario":null,"stem":"A team runs its chatbot with adaptive thinking at high effort on every request, including one-line greetings. Latency and cost rose, with no measurable quality gain on those replies. What is the best response?","code":null,"options":[{"letter":"A","text":"Disable thinking for the whole application, since it adds latency and cost to every single reply it sends"},{"letter":"B","text":"Move to the most capable model, which answers simple turns quickly even at high effort"},{"letter":"C","text":"Raise effort to `max` everywhere, so every turn gets the most careful answer possible"},{"letter":"D","text":"Decide per workload: keep deeper reasoning where evals show gains, and route simple turns at low effort"}],"answer":["D"],"explanation":"Reasoning buys accuracy on multi-step problems and costs output tokens and latency everywhere else, so depth is a per-workload choice backed by evals (D). A gives up the gains where they exist (and on some current models thinking can't be disabled at all). C and B spend more on replies that didn't need it."},{"n":20,"domain":"d5","scenario":null,"stem":"An autocomplete feature must return short suggestions within a few hundred milliseconds, and the quality bar is modest. Which setup fits?","code":null,"options":[{"letter":"A","text":"A fast-tier (Haiku-class) model with streaming and a small `max_tokens`"},{"letter":"B","text":"A top-tier model with extended thinking, so the suggestions are as good as possible"},{"letter":"C","text":"A balanced-tier model with `max_tokens` of 32,000"},{"letter":"D","text":"The Batch API, which halves the cost of each suggestion request"}],"answer":["A"],"explanation":"Latency-critical, high-volume, bounded tasks are the fast tier's case (A). B adds the most latency of all the options. Batch (D) is asynchronous. C misses the latency target, and a huge output budget is pointless for short suggestions."},{"n":21,"domain":"d6","scenario":null,"stem":"You pass a 50-page contract and ask detailed questions about it. Answers sometimes miss relevant clauses. Which prompt structure follows Anthropic's long-context guidance?","code":null,"options":[{"letter":"A","text":"The contract twice, once before and once after the question, so that no clause in it is missed"},{"letter":"B","text":"The question first, so Claude knows what to look for, then the contract"},{"letter":"C","text":"The question in the middle of the contract, next to the clauses it is about"},{"letter":"D","text":"The contract first, in tags such as `<contract>`, then the instructions and question at the end"}],"answer":["D"],"explanation":"Anthropic recommends putting long documents at the top and the query at the end, and reports up to 30% better responses in tests with complex inputs; the tags keep the document separate from the instructions (D). B and C go against that guidance, and A doubles the cost and the noise. Asking Claude to quote the relevant clauses before answering also helps it focus."},{"n":22,"domain":"d6","scenario":null,"stem":"Your code forced JSON output by prefilling the assistant turn with an opening brace. After moving to a newer model, requests with the prefilled last assistant turn return a 400 error. What is the recommended replacement?","code":{"lang":"python","text":"messages = [\n    {\"role\": \"user\", \"content\": f\"Extract the fields from: {doc}\"},\n    {\"role\": \"assistant\", \"content\": \"{\"},   # prefill\n]"},"options":[{"letter":"A","text":"Stay on the older model permanently"},{"letter":"B","text":"Structured outputs: put the JSON schema in `output_config.format` and drop the prefill"},{"letter":"C","text":"Add 'respond only in JSON' to the prompt and extract the first {...} block with a regex"},{"letter":"D","text":"Prefill with an opening square bracket instead, which the newer models still accept"}],"answer":["B"],"explanation":"Starting with the Claude 4.6 models, a prefilled last assistant turn is rejected, and Anthropic's migration guidance for format control points to structured outputs (B). D is still a prefill. C goes back to probabilistic formatting with fragile parsing. A blocks every future upgrade."},{"n":23,"domain":"d6","scenario":null,"stem":"Which TWO practices make a few-shot prompt for a tricky classification more reliable? (Select TWO)","code":null,"options":[{"letter":"A","text":"Examples wrapped in tags such as `<example>`, clearly separated from the input to classify"},{"letter":"B","text":"Examples that contradict the instructions, to test robustness"},{"letter":"C","text":"Examples that all share the same label"},{"letter":"D","text":"Fifty near-identical examples, so that the model sees the same pattern many times over"},{"letter":"E","text":"Two to four varied examples, including one the model should correctly reject"}],"answer":["A","E"],"explanation":"A small, varied set with a negative case teaches the boundary (E), and clear separation keeps the model from mixing examples with the real input (A). Near-identical examples (D) and single-label sets (C) teach a narrow pattern. Contradictory examples (B) teach the model to ignore your instructions."},{"n":24,"domain":"d6","scenario":null,"stem":"A benefits assistant receives three HR policy documents in every request. When employees ask about benefits the policies don't mention, it still answers with confident specifics. Which request design fixes this?","code":null,"options":[{"letter":"A","text":"Ask the model to add a confidence score to each answer, and show low-confidence answers with a warning"},{"letter":"B","text":"Switch to structured outputs with a required `answer` field, so every reply has the same shape"},{"letter":"C","text":"Use cited policy documents, require a cited passage per answer, and allow 'not covered in the policies'"},{"letter":"D","text":"Add the whole company intranet to the context, so that far more of the employees' questions are covered"}],"answer":["C"],"explanation":"Grounding needs a source to cite and permission to say the answer isn't there (C). More context (D) moves the boundary without teaching the model to stop at it. A self-reported confidence score (A) isn't verification. A required `answer` field (B) forces an answer even when there isn't one, and citations can't be combined with structured outputs in one request."},{"n":25,"domain":"d7","scenario":null,"stem":"A research agent reads web pages. One page hides text telling the agent to email the user's files to an outside address, and the agent has a `send_email` tool. Which TWO controls most directly reduce this risk? (Select TWO)","code":null,"options":[{"letter":"A","text":"A lower effort level, so the agent carries out fewer multi-step instructions"},{"letter":"B","text":"A system-prompt line telling the agent to ignore malicious instructions, as the only defense it relies on"},{"letter":"C","text":"Least-privilege tools: no `send_email` tool for the research agent, or human approval on outbound email"},{"letter":"D","text":"A deterministic gate in code that blocks or holds any action sending data to an external address"},{"letter":"E","text":"A larger model, which is better at spotting hidden instructions in web pages"}],"answer":["C","D"],"explanation":"Content the agent reads is an untrusted channel, so the strongest controls limit what an injected instruction can do: no dangerous capability (C) and a programmatic check on risky actions (D). A prompt instruction on its own (B) is probabilistic. Model size (E) and effort (A) aren't security controls."},{"n":26,"domain":"d7","scenario":null,"stem":"A developer put the production API key into a system-prompt template in the repository 'so the agent can call internal APIs.' Which TWO steps fix this? (Select TWO)","code":null,"options":[{"letter":"A","text":"Have your tool code authenticate to the internal APIs, so the model never sees the credential"},{"letter":"B","text":"Move the key to the end of the prompt, where users are less likely to see it"},{"letter":"C","text":"Tell the model in the system prompt never to reveal the key to anyone who asks for it"},{"letter":"D","text":"Base64-encode the key in the template so it isn't readable in plain text"},{"letter":"E","text":"Rotate the key, and store secrets in environment variables or a secret manager"}],"answer":["A","E"],"explanation":"A key in a repository and a prompt is already exposed, so it gets rotated and stored properly (E), and credentials belong in the code that executes tools, outside the model's context (A). Encoding (D) is trivially reversed, an instruction (C) is probabilistic, and moving the key (B) keeps it in the prompt."},{"n":27,"domain":"d7","scenario":null,"stem":"An internal HR assistant answers every employee's questions using one service account that can read all employee records. A junior employee asked about a colleague's salary and got an answer. What is the root fix?","code":null,"options":[{"letter":"A","text":"Run lookups with the calling user's identity and permissions, and log each call against that user"},{"letter":"B","text":"Add a system-prompt rule, 'Never reveal salaries', and repeat it to the model at the start of every turn"},{"letter":"C","text":"Remove salary data from the HR system that the assistant's service account can read"},{"letter":"D","text":"Filter out any response that contains the word 'salary' before it reaches the employee"}],"answer":["A"],"explanation":"The shared over-privileged account erased per-user authorization and the audit trail, and acting as the caller restores both (A). B is a probabilistic patch. C breaks legitimate HR work. A keyword filter (D) is easy to get around and blocks legitimate answers."},{"n":28,"domain":"d8","scenario":null,"stem":"Which statement about server-side tools such as web search is correct?","code":null,"options":[{"letter":"A","text":"They're available only through MCP, so each one needs an MCP server configured for it"},{"letter":"B","text":"Your application must implement and execute them, then return their results as `tool_result` blocks"},{"letter":"C","text":"They work only in the Batch API, because their results take longer to produce than a normal request allows"},{"letter":"D","text":"They run on Anthropic's infrastructure, so your code doesn't execute them or return `tool_result` blocks"}],"answer":["D"],"explanation":"Server tools execute on Anthropic's side, and their results come back inside the response (D). Client tools are the ones your code runs (B). Server tools are declared in the tools parameter like any other tool (A), and they work in regular requests (C)."},{"n":29,"domain":"d8","scenario":null,"stem":"Your company's quarterly-report procedure is 12 steps with templates and formatting rules. Teams want Claude to follow it in claude.ai, Claude Code and the API. No new external system is involved. Which mechanism fits?","code":null,"options":[{"letter":"A","text":"A custom tool that returns the procedure's steps when Claude calls it"},{"letter":"B","text":"An MCP server that serves the templates to Claude, claude.ai, and the API"},{"letter":"C","text":"A Skill: packaged instructions and templates that load when the task matches"},{"letter":"D","text":"A fine-tuned model trained on the past quarterly reports and on their templates"}],"answer":["C"],"explanation":"The need is know-how and workflow steps, which is what Skills package (C). Tools (A) and MCP servers (B) add actions or data access, and nothing here needs a new action or data source. Fine-tuning (D) is heavy machinery for a procedure that fits in a document."},{"n":30,"domain":"d8","scenario":null,"stem":"An agent calls `create_shipment` with inputs that sometimes have the wrong type (weight as a string) or miss required fields, which breaks your handler. Which API feature addresses this at the source?","code":null,"options":[{"letter":"A","text":"`strict: true` on the tool definition, so tool inputs follow the `input_schema`"},{"letter":"B","text":"`tool_choice` set to `auto`, so the model decides when to call the tool"},{"letter":"C","text":"A longer, more detailed tool description that explains each of the fields and its type"},{"letter":"D","text":"A higher effort level, so the model checks its tool inputs more carefully"}],"answer":["A"],"explanation":"Strict tool use applies schema validation to the tool's inputs (A). A better description (C) helps the model pick and fill the tool and still guarantees nothing. `auto` (B) is the default and changes nothing. More effort (D) changes how much the model reasons and still can't guarantee types."}]},{"id":"ccdv-p","code":"CCDV-P","name":"Claude Certified Developer - Professional","certPage":"https://preporato.com/certificates/claude-certified-developer-professional","guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md","exam":{"questions":70,"scored":60,"minutes":120},"minutes":51,"domains":[{"id":"d1","name":"Advanced Agent Architecture and Orchestration","weight":17,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-1-advanced-agent-architecture-and-orchestration-17"},{"id":"d2","name":"Production Integration, Reliability, and Knowledge Grounding","weight":20,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-2-production-integration-reliability-and-knowledge-grounding-20"},{"id":"d3","name":"Observability and Production Monitoring","weight":12,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-3-observability-and-production-monitoring-12"},{"id":"d4","name":"Advanced Debugging and Incident Response","weight":10,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-4-advanced-debugging-and-incident-response-10"},{"id":"d5","name":"Evaluation Engineering and Quality Assurance","weight":12,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-5-evaluation-engineering-and-quality-assurance-12"},{"id":"d6","name":"Cost and Latency Optimization at Scale","weight":8,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-6-cost-and-latency-optimization-at-scale-8"},{"id":"d7","name":"Runtime Guardrails and Production Security","weight":11,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-7-runtime-guardrails-and-production-security-11"},{"id":"d8","name":"Agent Fleet Operations for Software Delivery","weight":10,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-p/guide.md#domain-8-agent-fleet-operations-for-software-delivery-10"}],"scenarios":[],"questions":[{"n":1,"domain":"d1","scenario":null,"stem":"A contract-review system uses a supervisor agent that sends search tasks to three worker agents. When one worker's search tool times out, the worker returns an empty list, and the supervisor tells the user that no matching contracts exist. What fixes the cause?","code":null,"options":[{"letter":"A","text":"Pass each worker's full transcript back to the supervisor so that it can read every tool call and decide for itself what happened"},{"letter":"B","text":"Have workers report success, empty, or failed with a reason, and treat a failure differently from an empty result"},{"letter":"C","text":"Raise the supervisor's effort level so that it reasons more carefully about whether each empty result from a worker is plausible"},{"letter":"D","text":"Re-run the whole fan-out of all three workers whenever any one of them returns an empty result, and report only the second answers"}],"answer":["B"],"explanation":"The supervisor can't tell \"nothing found\" from \"the search failed\" because the hand-off doesn't say which happened; an explicit status in the result contract fixes that (B). More effort (C) can't recover information the worker never sent, full transcripts (A) flood the supervisor's context to work around a missing field, and re-running everything (D) multiplies cost and still can't tell a real empty result from a failure."},{"n":2,"domai
